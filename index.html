
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pasal Manager | पसल व्यवस्थापक</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Tiro+Devanagari+Nepali&family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/nepali-date-converter/dist/nepali-date-converter.umd.js"></script>
<style>
  :root{
    --bg: #FAF6EE;
    --surface: #FFFFFF;
    --surface-2: #F3ECDD;
    --ink: #251F1A;
    --ink-soft: #6E6459;
    --ink-faint: #A69C8E;
    --crimson: #A11D33;
    --crimson-dark: #7C1526;
    --crimson-tint: #F4E2E3;
    --indigo: #16305C;
    --indigo-soft: #2A4A82;
    --indigo-tint: #E4E9F2;
    --gold: #B9862B;
    --gold-tint: #F3E6C8;
    --success: #2F7D5B;
    --success-tint: #E1EFE7;
    --warning: #B5760D;
    --warning-tint: #FBEBD3;
    --danger: #B23A2E;
    --danger-tint: #F7E3E0;
    --border: #E6DCC8;
    --radius: 10px;
    --font-display: 'Fraunces', 'Tiro Devanagari Nepali', serif;
    --font-body: 'Inter', 'Noto Sans Devanagari', sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
    --shadow-sm: 0 1px 2px rgba(37,31,26,0.06), 0 1px 1px rgba(37,31,26,0.04);
    --shadow-md: 0 6px 20px rgba(37,31,26,0.08);
    --shadow-lg: 0 16px 40px rgba(37,31,26,0.14);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--font-body);
    font-size:14.5px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  #app{min-height:100vh;}
  h1,h2,h3,.display{font-family:var(--font-display);}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;font-size:inherit;}
  a{color:inherit;}
  ::selection{background:var(--gold-tint);}

  /* ---------- ridge motif ---------- */
  .ridge{width:100%;height:14px;display:block;}
  .ridge svg{width:100%;height:100%;display:block;}

  /* ---------- scrollbars ---------- */
  ::-webkit-scrollbar{width:10px;height:10px;}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px;}
  ::-webkit-scrollbar-track{background:transparent;}

  /* ---------- top bar ---------- */
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 26px;background:var(--indigo);color:#fff;
  }
  .brand{display:flex;align-items:center;gap:10px;}
  .brand-mark{
    width:34px;height:34px;border-radius:8px;background:linear-gradient(155deg,var(--crimson),var(--crimson-dark));
    display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--font-display);font-weight:700;font-size:17px;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,0.25);
  }
  .brand-text .en{font-family:var(--font-display);font-weight:600;font-size:17px;letter-spacing:0.2px;line-height:1.1;}
  .brand-text .np{font-size:11px;color:rgba(255,255,255,0.68);letter-spacing:0.3px;}
  .top-right{display:flex;align-items:center;gap:14px;}
  .lang-toggle{
    display:flex;background:rgba(255,255,255,0.1);border-radius:999px;padding:3px;gap:2px;
    border:1px solid rgba(255,255,255,0.18);
  }
  .lang-toggle button{
    border:none;background:transparent;color:rgba(255,255,255,0.75);padding:6px 14px;border-radius:999px;
    font-size:12.5px;font-weight:600;letter-spacing:0.3px;transition:all .15s ease;
  }
  .lang-toggle button.active{background:var(--gold);color:#241a05;}
  .user-chip{
    display:flex;align-items:center;gap:8px;background:rgba(255,255,255,0.08);color:#fff;
    border:1px solid rgba(255,255,255,0.16);padding:6px 12px 6px 6px;border-radius:999px;font-size:12.5px;
    font-family:inherit;text-align:left;
  }
  .user-chip:hover{background:rgba(255,255,255,0.14);}
  .user-chip .dot{width:26px;height:26px;border-radius:50%;background:var(--gold);color:#241a05;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex-shrink:0;}
  .user-menu-dropdown{
    position:absolute;top:calc(100% + 8px);right:0;min-width:200px;background:#fff;border:1px solid var(--border);
    border-radius:10px;box-shadow:var(--shadow-lg);overflow:hidden;z-index:150;
  }
  .user-menu-item{
    display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:11px 14px;border:none;background:#fff;
    color:var(--ink);font-size:13px;font-weight:600;border-bottom:1px solid var(--border);
  }
  .user-menu-item:last-child{border-bottom:none;}
  .user-menu-item:hover{background:var(--surface-2);}
  .user-menu-item .ic{width:16px;text-align:center;font-size:14px;}
  .user-menu-item-danger{color:var(--danger);}
  .logout-btn{
    background:transparent;border:1px solid rgba(255,255,255,0.3);color:#fff;padding:6px 13px;border-radius:8px;font-size:12.5px;font-weight:600;
  }
  .logout-btn:hover{background:rgba(255,255,255,0.12);}

  /* ---------- shell layout ---------- */
  .shell{display:flex;min-height:calc(100vh - 62px);}
  .sidebar{
    width:230px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);
    padding:18px 12px;display:flex;flex-direction:column;gap:2px;
  }
  .side-label{font-size:10.5px;text-transform:uppercase;letter-spacing:1px;color:var(--ink-faint);padding:10px 12px 6px;font-weight:700;}
  .side-link{
    display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;color:var(--ink-soft);
    font-size:13.5px;font-weight:600;border:none;background:transparent;width:100%;text-align:left;
  }
  .side-link .ic{width:18px;text-align:center;font-size:14px;}
  .side-link:hover{background:var(--surface-2);color:var(--ink);}
  .side-link.active{background:var(--crimson-tint);color:var(--crimson-dark);}
  .side-sub{font-size:10.5px;color:var(--ink-faint);padding:0 12px;margin-top:-2px;margin-bottom:6px;}
  .main{flex:1;padding:26px 30px 60px;min-width:0;}

  /* ---------- generic ---------- */
  .page-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:12px;}
  .page-head h1{font-size:24px;margin:0 0 2px;font-weight:600;}
  .page-head .sub{color:var(--ink-soft);font-size:13px;}
  .btn{
    border:none;padding:9px 16px;border-radius:8px;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:7px;
    transition:transform .06s ease;
  }
  .btn:active{transform:scale(0.97);}
  .btn-primary{background:var(--crimson);color:#fff;}
  .btn-primary:hover{background:var(--crimson-dark);}
  .btn-indigo{background:var(--indigo);color:#fff;}
  .btn-indigo:hover{background:var(--indigo-soft);}
  .btn-outline{background:transparent;border:1px solid var(--border);color:var(--ink);}
  .btn-outline:hover{background:var(--surface-2);}
  .btn-gold{background:var(--gold);color:#2a1e06;}
  .btn-sm{padding:6px 11px;font-size:12px;border-radius:7px;}
  .btn-danger{background:var(--danger);color:#fff;}
  .btn[disabled]{opacity:0.45;cursor:not-allowed;}

  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-sm);}
  .card-pad{padding:18px 20px;}

  .grid{display:grid;gap:16px;}
  .grid-4{grid-template-columns:repeat(4,1fr);}
  .grid-3{grid-template-columns:repeat(3,1fr);}
  .grid-2{grid-template-columns:repeat(2,1fr);}
  .grid-billing{grid-template-columns:1.5fr 1fr;align-items:start;}
  @media(max-width:1100px){.grid-4{grid-template-columns:repeat(2,1fr);} .grid-3{grid-template-columns:repeat(2,1fr);}}

  /* ---------- mobile hamburger + slide-out drawer ---------- */
  .mobile-hamburger-btn{
    display:none; /* shown only on mobile, see breakpoint below */
    flex-direction:column;justify-content:center;gap:4px;
    width:34px;height:34px;border:none;background:rgba(255,255,255,0.1);border-radius:8px;
    padding:0;cursor:pointer;flex-shrink:0;
  }
  .mobile-hamburger-btn span{display:block;width:16px;height:2px;background:#fff;border-radius:2px;margin:0 auto;}
  .mobile-drawer-backdrop{
    position:fixed;inset:0;background:rgba(22,17,10,0.5);z-index:400;
    animation:drawerFadeIn .15s ease;
  }
  .mobile-drawer-panel{
    position:fixed;top:0;left:0;bottom:0;width:78vw;max-width:280px;background:var(--surface);
    z-index:401;box-shadow:var(--shadow-lg);overflow-y:auto;
    animation:drawerSlideIn .18s ease;
  }
  .mobile-drawer-head{
    display:flex;align-items:center;justify-content:space-between;padding:16px 14px;
    border-bottom:1px solid var(--border);background:var(--indigo);
  }
  .mobile-drawer-head .brand-text .en{color:#fff;font-size:15px;}
  .mobile-drawer-head .modal-close{background:rgba(255,255,255,0.14);color:#fff;}
  @keyframes drawerFadeIn{from{opacity:0;}to{opacity:1;}}
  @keyframes drawerSlideIn{from{transform:translateX(-100%);}to{transform:translateX(0);}}
  /* Force the reused sidebar markup back into a normal vertical list
     inside the drawer, overriding the ≤860px horizontal-strip rules below. */
  .mobile-drawer-panel .sidebar{
    display:flex !important;flex-direction:column !important;width:100% !important;
    overflow:visible !important;border:none !important;white-space:normal !important;
    padding:14px 10px !important;
  }
  .mobile-drawer-panel .side-label{display:block !important;}
  .mobile-drawer-panel .side-link{flex:none !important;width:100%;padding:11px 12px !important;}

  /* =========================================================
     RESPONSIVE / MOBILE LAYOUT
     Tablet and phone breakpoints so every screen (sidebar,
     stat grids, billing/reports split, tables, modals) stays
     usable on small devices, not just desktop.
     ========================================================= */
  @media(max-width:860px){
    .topbar{padding:12px 16px;flex-wrap:wrap;row-gap:8px;}
    .brand-text .en{font-size:15px;}
    .top-right{gap:8px;flex-wrap:wrap;}
    .user-chip{padding:5px 10px 5px 5px;}
    .user-chip > div:last-child{display:none;} /* hide name/role text, keep avatar */
    .shell{flex-direction:column;min-height:0;}
    .mobile-hamburger-btn{display:flex;}
    .sidebar{display:none;} /* replaced by the hamburger-triggered drawer on mobile */
    .main{padding:18px 14px 50px;}
    .page-head h1{font-size:20px;}
  }
  @media(max-width:640px){
    .grid-4, .grid-3, .grid-2, .grid-billing{grid-template-columns:1fr;}
    .card-pad{padding:15px 16px;}
    .stat-card{padding:14px 15px;}
    .modal{border-radius:12px;max-height:92vh;}
    .modal-body{padding:16px;}
    .modal-head, .modal-foot{padding:14px 16px;}
    .login-body{padding:20px 20px 24px;}
    .login-top{padding:22px 20px 18px;}
    .btn{padding:9px 13px;font-size:12.5px;}
    .btn-sm{padding:8px 12px;font-size:12.5px;min-height:34px;}
    table .btn-sm{margin:2px 0;}
    body{font-size:14px;}
  }
  @media(max-width:420px){
    .page-head{flex-direction:column;align-items:stretch;}
    .page-head > button, .page-head > div[style*="display:flex"]{width:100%;}
    table{font-size:12px;}
    thead th, tbody td{padding:8px 7px;}
  }

  .stat-card{padding:16px 18px;border-radius:var(--radius);border:1px solid var(--border);background:var(--surface);}
  .stat-card .label{font-size:11px;text-transform:uppercase;letter-spacing:0.5px;color:var(--ink-faint);font-weight:700;}
  .stat-card .value{font-family:var(--font-display);font-size:26px;font-weight:600;margin-top:4px;}
  .stat-card .foot{font-size:11.5px;color:var(--ink-soft);margin-top:4px;}
  .stat-card.accent-crimson{border-top:3px solid var(--crimson);}
  .stat-card.accent-indigo{border-top:3px solid var(--indigo);}
  .stat-card.accent-gold{border-top:3px solid var(--gold);}
  .stat-card.accent-success{border-top:3px solid var(--success);}
  .stat-card.accent-warning{border-top:3px solid var(--warning);}

  table{width:100%;border-collapse:collapse;font-size:13px;}
  thead th{
    text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:0.5px;color:var(--ink-faint);
    border-bottom:1px solid var(--border);padding:9px 10px;font-weight:700;background:var(--surface-2);
  }
  tbody td{padding:10px;border-bottom:1px solid var(--border);vertical-align:middle;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:#FCFAF5;}
  .table-wrap{overflow-x:auto;border-radius:var(--radius);border:1px solid var(--border);}
  .table-wrap table{border:none;}
  .table-wrap thead th{border-top:none;}

  .badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700;}
  .badge-success{background:var(--success-tint);color:var(--success);}
  .badge-warning{background:var(--warning-tint);color:var(--warning);}
  .badge-danger{background:var(--danger-tint);color:var(--danger);}
  .badge-indigo{background:var(--indigo-tint);color:var(--indigo);}
  .badge-gold{background:var(--gold-tint);color:#7a5613;}

  label.field-label{display:block;font-size:12px;font-weight:600;color:var(--ink-soft);margin-bottom:5px;}
  input.field, select.field, textarea.field{
    width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:8px;background:#fff;color:var(--ink);
    outline:none;
  }
  input.field:focus, select.field:focus, textarea.field:focus{border-color:var(--indigo-soft);box-shadow:0 0 0 3px var(--indigo-tint);}
  .field-row{margin-bottom:14px;}
  .field-hint{font-size:11px;color:var(--ink-faint);margin-top:4px;}
  .field-error{font-size:11.5px;color:var(--danger);margin-top:4px;font-weight:600;}

  .modal-backdrop{
    position:fixed;inset:0;background:rgba(22,17,10,0.45);display:flex;align-items:center;justify-content:center;
    z-index:100;padding:20px;
  }
  .modal{background:#fff;border-radius:14px;max-width:640px;width:100%;max-height:88vh;overflow-y:auto;box-shadow:var(--shadow-lg);}
  .modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--border);position:sticky;top:0;background:#fff;z-index:2;}
  .modal-head h3{margin:0;font-size:17px;}
  .modal-close{border:none;background:var(--surface-2);width:28px;height:28px;border-radius:50%;font-size:14px;color:var(--ink-soft);}
  .modal-body{padding:20px 22px;}
  .modal-foot{padding:16px 22px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px;position:sticky;bottom:0;background:#fff;}

  .toast-wrap{position:fixed;top:18px;right:18px;z-index:300;display:flex;flex-direction:column;gap:8px;}
  .toast{
    background:var(--ink);color:#fff;padding:11px 16px;border-radius:9px;font-size:13px;box-shadow:var(--shadow-md);
    display:flex;align-items:center;gap:8px;min-width:220px;animation:toastIn .18s ease;
  }
  .toast.success{background:var(--success);}
  .toast.error{background:var(--danger);}
  @keyframes toastIn{from{opacity:0;transform:translateY(-6px);}to{opacity:1;transform:translateY(0);}}

  .empty-state{padding:40px 20px;text-align:center;color:var(--ink-soft);}
  .empty-state .ic{font-size:28px;margin-bottom:8px;}

  /* ---------- login ---------- */
  .login-wrap{
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:
      radial-gradient(circle at 15% 20%, rgba(161,29,51,0.08), transparent 45%),
      radial-gradient(circle at 85% 80%, rgba(22,48,92,0.10), transparent 45%),
      var(--bg);
    padding:20px;position:relative;overflow:hidden;
  }
  .login-card{
    width:100%;max-width:400px;background:#fff;border-radius:16px;box-shadow:var(--shadow-lg);border:1px solid var(--border);
    overflow:hidden;position:relative;z-index:2;
  }
  .login-top{background:var(--indigo);padding:26px 26px 20px;color:#fff;text-align:center;}
  .login-top .mark{
    width:46px;height:46px;border-radius:11px;background:linear-gradient(155deg,var(--crimson),var(--crimson-dark));
    display:flex;align-items:center;justify-content:center;margin:0 auto 10px;font-family:var(--font-display);font-weight:700;font-size:21px;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,0.25);
  }
  .login-top h1{font-size:19px;margin:0;font-weight:600;}
  .login-top .np{font-size:12px;color:rgba(255,255,255,0.7);margin-top:2px;}
  .login-body{padding:22px 26px 26px;}
  .role-tabs{display:flex;gap:6px;background:var(--surface-2);padding:4px;border-radius:9px;margin-bottom:18px;}
  .role-tabs button{flex:1;border:none;background:transparent;padding:8px 6px;border-radius:7px;font-size:12.5px;font-weight:700;color:var(--ink-soft);}
  .role-tabs button.active{background:#fff;color:var(--crimson-dark);box-shadow:var(--shadow-sm);}
  .supplier-section-tabs{display:flex;gap:12px;margin-bottom:22px;flex-wrap:wrap;}
  .supplier-section-tab{
    display:flex;align-items:center;gap:10px;padding:14px 20px;border-radius:12px;
    border:2px solid var(--border);background:var(--surface);font-size:14px;font-weight:700;color:var(--ink-soft);
    min-width:200px;justify-content:flex-start;
  }
  .supplier-section-tab .ic{font-size:19px;}
  .supplier-section-tab:hover{border-color:var(--indigo-soft);background:var(--indigo-tint);}
  .supplier-section-tab.active{border-color:var(--crimson);background:var(--crimson-tint);color:var(--crimson-dark);box-shadow:var(--shadow-sm);}
  .demo-box{background:var(--gold-tint);border:1px dashed #d8b866;border-radius:8px;padding:10px 12px;font-size:11.5px;color:#6b4e10;margin-top:14px;line-height:1.5;}
  .demo-box b{cursor:pointer;text-decoration:underline;}
  .login-error{background:var(--danger-tint);color:var(--danger);border-radius:8px;padding:9px 12px;font-size:12.5px;font-weight:600;margin-bottom:14px;}

  /* ridge across login bottom */
  .login-ridge{position:absolute;bottom:0;left:0;width:100%;z-index:1;opacity:0.9;}

  /* ---------- invoice ---------- */
  .invoice-sheet{background:#fff;border:1px solid var(--border);border-radius:12px;max-width:480px;margin:0 auto;overflow:hidden;}
  .invoice-head{background:var(--indigo);color:#fff;padding:18px 20px;}
  .invoice-head .shopname{font-family:var(--font-display);font-size:18px;font-weight:600;}
  .invoice-head .meta{font-size:11px;color:rgba(255,255,255,0.75);margin-top:2px;}
  .invoice-body{padding:18px 20px;}
  .invoice-row{display:flex;justify-content:space-between;font-size:12.5px;padding:4px 0;}
  .invoice-items table{font-size:12px;}
  .invoice-totals{border-top:1px dashed var(--border);margin-top:10px;padding-top:10px;}
  .invoice-qr{display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 0 6px;border-top:1px dashed var(--border);margin-top:12px;}
  .invoice-qr img, .invoice-qr canvas{border-radius:8px;border:1px solid var(--border);padding:6px;background:#fff;}
  .invoice-foot{text-align:center;font-size:11px;color:var(--ink-faint);padding:12px 20px 18px;}
  .invoice-copy-label{text-align:center;font-size:10px;font-weight:700;letter-spacing:0.5px;text-transform:uppercase;color:var(--gold);background:var(--gold-tint);padding:4px 0;}
  .invoice-copy-divider{border-top:2px dashed var(--ink-faint);margin:6px 0;position:relative;}
  .invoice-copy-divider::after{content:'\2702';position:absolute;left:50%;top:-9px;transform:translateX(-50%);background:#fff;padding:0 6px;font-size:12px;color:var(--ink-faint);}

  .kv{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--border);font-size:13px;}
  .kv:last-child{border-bottom:none;}
  .kv .k{color:var(--ink-soft);}
  .kv .v{font-weight:600;}

  .search-box{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--border);border-radius:8px;padding:8px 12px;}

  .tag-pill{display:inline-flex;padding:3px 10px;border-radius:999px;background:var(--surface-2);font-size:11.5px;font-weight:600;color:var(--ink-soft);}

    /* Named pages: three selectable bill formats (58mm/80mm thermal, or
       full A4) plus the separate Reports printout — each gets its own
       @page so one doesn't force its size onto the others. */
    @page invoice-page-38{ size: 38mm auto; margin: 1mm; }
    @page invoice-page-58{ size: 58mm auto; margin: 1.5mm; }
    @page invoice-page-80{ size: 80mm auto; margin: 2mm; }

    @page report-page{
      size: A4;
      margin: 14mm;
    }
    @page{ margin: 10mm; }
    html, body{ background:#fff !important; }
    body *{visibility:hidden;}
    #printable-invoice, #printable-invoice *{visibility:visible;}
    #printable-report, #printable-report *{visibility:visible;}
    #printable-invoice{
      position:absolute;top:0;left:0;
      margin:0;
      box-shadow:none;border:none;border-radius:0;
      color:#000;

    #printable-invoice.print-format-58mm{ page:invoice-page-58; width:54mm; max-width:54mm; font-size:9.5px; }
    #printable-invoice.print-format-80mm{ page:invoice-page-80; width:76mm; max-width:76mm; font-size:11px; }
    #printable-invoice.print-format-a4{ page:invoice-page-a4; width:100%; max-width:174mm; font-size:13px; left:50%; transform:translateX(-50%); }
    /* Thermal printers are monochrome — drop colored backgrounds/text
       that would print as a solid black block or vanish entirely. */
    #printable-invoice .invoice-head{
      background:#fff !important;
      color:#000 !important;
      padding:3mm 1mm 2mm;
      text-align:center;
      border-bottom:1px dashed #000;
    }
    #printable-invoice .invoice-head .shopname{
      font-size:1.35em;
      font-weight:700;
      color:#000 !important;
    }
    #printable-invoice .invoice-head .meta{
      color:#000 !important;
      font-size:0.9em;
      opacity:1;
    }
    #printable-invoice.print-format-a4 .invoice-head{
      padding:0 0 4mm;

      align-items:center !important;

    #printable-invoice.print-format-a4 .invoice-head > div{ text-align:center !important; }

    #printable-invoice .invoice-items th, #printable-invoice .invoice-items td{ padding:1mm 0.5mm; }
    #printable-invoice .invoice-totals{ border-top:1px dashed #000; }
    #printable-invoice .invoice-totals .invoice-row:last-child{
      font-size:1.2em !important; font-weight:800 !important; color:#000 !important;
    }
    #printable-invoice .invoice-qr{ border-top:1px dashed #000; padding:3mm 0 1mm; }
    #printable-invoice .invoice-qr img, #printable-invoice .invoice-qr canvas{
      width:32mm !important; height:32mm !important;
      border:none; padding:0;
    }
    #printable-invoice .invoice-qr div{ color:#000 !important; }
    #printable-invoice .invoice-foot{ font-size:0.9em; padding:2mm 1mm; color:#000 !important; }
    #printable-invoice hr.hair{ border:none; border-top:1px dashed #000; margin:2mm 0; }
    #printable-invoice .invoice-copy-label{ background:#fff !important; color:#000 !important; border-bottom:1px dashed #000; }
    #printable-invoice .invoice-copy-divider{ border-top:2px dashed #000; margin:3mm 0; }
    #printable-invoice .invoice-copy-divider::after{ background:#fff !important; color:#000 !important; }
    /* Never print action buttons even if a stray one ends up inside the sheet. */
    #printable-invoice button{ display:none !important; }

    /* Full-page Sales/Purchases report — normal A4 layout with a
       letterhead (shop name, address, PAN) at the top. */
    #printable-report{
      page: report-page;
      position:absolute;top:0;left:0;right:0;
      width:100%;
      margin:0;
      color:#000;
      font-size:12px;
    }
    #printable-report .report-letterhead{
      text-align:center;
      border-bottom:2px solid #000;
      padding-bottom:10px;
      margin-bottom:16px;

    #printable-report .report-letterhead .shopname{
      font-size:22px;

    #printable-report .report-letterhead .meta{

      font-weight:700;
      margin-bottom:2px;
      color:#000 !important;
    }
    #printable-report .report-range{
      font-size:11px;
      color:#000 !important;
      margin-bottom:14px;
    }
    #printable-report table{ width:100%; font-size:11px; border-collapse:collapse; }
    #printable-report th, #printable-report td{
      padding:5px 6px; border-bottom:1px solid #999; text-align:left; color:#000 !important;
    }
    #printable-report thead th{ border-bottom:2px solid #000; background:#fff !important; font-weight:700; }
    #printable-report .report-total-row td{ font-weight:800; border-top:2px solid #000; border-bottom:none; }
    #printable-report .report-footer{ margin-top:16px; font-size:10px; color:#000 !important; text-align:right; }
    #printable-report button{ display:none !important; }
  }

  hr.hair{border:none;border-top:1px solid var(--border);margin:16px 0;}

<div id="app"></div>
<div class="toast-wrap" id="toastWrap"></div>
<div id="fbStatusBadge" style="position:fixed;bottom:14px;left:14px;z-index:400;font-size:11px;font-family:'JetBrains Mono',monospace;padding:5px 10px;border-radius:999px;background:#251F1A;color:#fff;opacity:0.85;display:none;"></div>

<!-- =========================================================
     FIREBASE INTEGRATION
     Modular Firebase v12 SDK. Initializes the app + Firestore
     and exposes a small helper API on window.__fb that the
     classic app script below calls into for persistence.
     This runs as an ES module, so it is fetched/executed
     asynchronously — the classic script waits for it via the
     'firebase-ready' event (see boot() near the bottom).
     ========================================================= -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
  import { getAnalytics, isSupported as analyticsIsSupported } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-analytics.js";
  import {
    getFirestore, collection, doc, setDoc, getDoc, getDocs, deleteDoc, serverTimestamp,
    enableIndexedDbPersistence
  } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

  // Your web app's Firebase configuration
  const firebaseConfig = {
    apiKey: "AIzaSyBUzJGP6EN_AKtbdyAWtxQ2bAMybmB_LPQ",
    authDomain: "pasal-d6b9c.firebaseapp.com",
    projectId: "pasal-d6b9c",
    storageBucket: "pasal-d6b9c.firebasestorage.app",
    messagingSenderId: "756789010377",
    appId: "1:756789010377:web:56f321e8eb604adfa41218",
    measurementId: "G-5L15C88YXB"
  };

  var lastFailedSave = null; // {shop} — lets the badge offer a manual retry

  function setFbBadge(text, bg, opts){
    // Visual badge intentionally hidden from the UI — status is still
    // logged to the console for diagnostics, and click-to-retry still
    // works if the person re-enables it (see fbStatusBadge in the HTML).
    console.log('[Firebase status] ' + text);
    var el = document.getElementById('fbStatusBadge');
    if(!el) return;
    el.textContent = text;
    el.style.cursor = (opts && opts.clickable) ? 'pointer' : 'default';
    if(bg) el.style.background = bg;
  }

  // Human-readable explanation for the Firestore error codes people
  // actually hit, so "sync error" isn't a dead end.
  function explainFirestoreError(e){
    var code = e && e.code ? e.code : '';
    switch(code){
      case 'permission-denied':
        return 'Firebase: blocked by security rules (check Firestore → Rules)';
      case 'unavailable':
        return 'Firebase: network unavailable — will retry';
      case 'not-found':
        return 'Firebase: database not found (enable Firestore in console)';
      case 'invalid-argument':
        return 'Firebase: invalid data in save — check console for details';
      case 'resource-exhausted':
        return 'Firebase: quota exceeded';
      case 'unauthenticated':
        return 'Firebase: not authenticated';
      default:
        return 'Firebase: sync error (' + (code || (e && e.message) || 'unknown') + ')';
    }
  }

  // Firestore rejects `undefined` anywhere in a document (it throws
  // "Unsupported field value: undefined" and the whole write fails).
  // Plain JS objects easily pick up stray undefined values (an unset
  // form field, a missing optional property, etc.), so recursively
  // convert every undefined to null before every write.
  function sanitizeForFirestore(value){
    if(value === undefined) return null;
    if(value === null || typeof value !== 'object') return value;
    if(Array.isArray(value)) return value.map(sanitizeForFirestore);
    var out = {};
    Object.keys(value).forEach(function(k){
      out[k] = sanitizeForFirestore(value[k]);
    });
    return out;
  }

  function sleep(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }

  (async function initFirebase(){
    try{
      var app = initializeApp(firebaseConfig);
      var db = getFirestore(app);

      // Queue writes locally (IndexedDB) when offline/blocked by a flaky
      // network, and flush them automatically once connectivity returns —
      // turns most transient "sync error" cases into a silent auto-retry.
      try{ await enableIndexedDbPersistence(db); }
      catch(e){ /* multiple tabs open, or unsupported browser — fine, just no offline queue */ }

      // Analytics only works in real browser contexts with support; guard it.
      try{
        if(await analyticsIsSupported()){
          getAnalytics(app);
        }
      }catch(e){ /* analytics not available in this environment, ignore */ }

      var SHOPS_COLLECTION = 'shops';

      window.__fb = {
        db: db,

        // Load every shop document from Firestore.
        async loadShops(){
          var snap = await getDocs(collection(db, SHOPS_COLLECTION));
          var shops = [];
          snap.forEach(function(d){ shops.push(d.data()); });
          return shops;
        },

        // Create or overwrite a single shop document (id = shop.id).
        // Retries a couple of times on transient failures before giving up.
        async saveShop(shop){
          if(!shop || !shop.id) return;
          var payload = sanitizeForFirestore(Object.assign({}, shop, {
            _updatedAt: serverTimestamp()
          }));
          var attempts = 0, maxAttempts = 3, lastErr = null;
          while(attempts < maxAttempts){
            try{
              await setDoc(doc(db, SHOPS_COLLECTION, shop.id), payload);
              lastFailedSave = null;
              setFbBadge('Firebase: synced', '#2F7D5B');
              return;
            }catch(e){
              lastErr = e;
              attempts++;
              // permission-denied / invalid-argument won't fix themselves —
              // no point retrying those, fail fast with a clear message.
              if(e && (e.code === 'permission-denied' || e.code === 'invalid-argument')) break;
              if(attempts < maxAttempts) await sleep(600 * attempts);
            }
          }
          console.error('Firestore saveShop failed after retries:', lastErr);
          lastFailedSave = { shop: shop };
          setFbBadge(explainFirestoreError(lastErr) + ' — tap to retry', '#B23A2E', {clickable:true});
        },

        // Remove a shop document entirely.
        async deleteShop(shopId){
          try{
            await deleteDoc(doc(db, SHOPS_COLLECTION, shopId));
          }catch(e){
            console.error('Firestore deleteShop failed:', e);
          }
        },

        // Manual retry, wired to a click on the status badge.
        async retryLastSave(){
          if(lastFailedSave && lastFailedSave.shop){
            setFbBadge('Firebase: retrying…', '#B5760D');
            await window.__fb.saveShop(lastFailedSave.shop);
          }
        }
      };

      var badgeEl = document.getElementById('fbStatusBadge');
      if(badgeEl){
        badgeEl.addEventListener('click', function(){ window.__fb.retryLastSave(); });
      }

      setFbBadge('Firebase: connected', '#16305C');
      window.dispatchEvent(new Event('firebase-ready'));
    }catch(e){
      console.error('Firebase initialization failed:', e);
      setFbBadge('Firebase: offline (using local demo data)', '#B23A2E');
      // Let the app boot anyway with local in-memory data.
      window.dispatchEvent(new Event('firebase-ready'));
    }
  })();
</script>

/* =========================================================
   PASAL MANAGER — multi-shop management demo system
   Data now persists to Firebase Firestore (see the module
   script above). On boot, the app loads shops from Firestore;
   if the "shops" collection is empty it seeds it with the
   built-in demo shop. Every mutation to a shop (products,
   customers, sales, settings, stock, QR, etc.) is written
   back to Firestore via fbSaveShop(shop) so changes survive
   page reloads and are shared across sessions.
   ========================================================= */

/* ---------------- utilities ---------------- */
function uid(prefix){ return prefix + '_' + Math.random().toString(36).slice(2,9); }
function escapeHtml(s){
  return String(s==null?'':s).replace(/[&<>"']/g, function(c){
    return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];
  });
}
function fmtMoney(n){
  n = Number(n)||0;
  return 'Rs. ' + n.toLocaleString('en-IN', {minimumFractionDigits:2, maximumFractionDigits:2});
}
function fmtDate(d){
  var dt = new Date(d);
  return dt.toLocaleDateString('en-GB', {day:'2-digit', month:'short', year:'numeric'});
}
function fmtDateTime(d){
  var dt = new Date(d);
  return dt.toLocaleDateString('en-GB', {day:'2-digit', month:'short', year:'numeric'}) + ', ' +
         dt.toLocaleTimeString('en-GB', {hour:'2-digit', minute:'2-digit'});
}
function toast(msg, type){
  var wrap = document.getElementById('toastWrap');
  var el = document.createElement('div');
  el.className = 'toast ' + (type||'');
  el.innerHTML = (type==='success' ? '&#10003; ' : type==='error' ? '&#9888; ' : '') + escapeHtml(msg);
  wrap.appendChild(el);
  setTimeout(function(){ el.style.opacity='0'; el.style.transition='opacity .25s'; setTimeout(function(){ el.remove(); }, 250); }, 2600);
}
function initials(name){
  return (name||'').split(' ').filter(Boolean).slice(0,2).map(function(w){return w[0];}).join('').toUpperCase();
}

/* =========================================================
   EMAIL NOTIFICATIONS (EmailJS — no backend required)
   Sends a security notice whenever a shop admin's password is
   changed. This app is a single static HTML file with no
   server, so it uses EmailJS: a service designed to send email
   directly from client-side JS using a PUBLIC key (safe to
   expose — restrict it to your domain in the EmailJS
   dashboard), not a secret API key.

   SETUP REQUIRED (one-time, free tier available):
   1. Create an account at https://www.emailjs.com
   2. Add an Email Service (e.g. Gmail) → note its Service ID
   3. Create an Email Template with variables: {{to_email}},
      {{shop_name}}, {{changed_at}} → note its Template ID
   4. Account → General → copy your Public Key
   5. Paste all three below. Until you do, password changes
      still save correctly — only the email step is skipped,
      with a toast letting the admin know.

   SECURITY NOTE: this notification deliberately does NOT
   include the new password itself. Emailing a live password
   is an unnecessary extra exposure — the notice's job is just
   to alert the shop owner that a change happened, so they can
   act fast if it wasn't them.
   ========================================================= */
var EMAILJS_CONFIG = {
  serviceId: 'YOUR_EMAILJS_SERVICE_ID',
  templateId: 'YOUR_EMAILJS_TEMPLATE_ID',
  publicKey: 'YOUR_EMAILJS_PUBLIC_KEY'
};
var emailjsReady = false;
try{
  if(window.emailjs && EMAILJS_CONFIG.publicKey.indexOf('YOUR_') !== 0){
    emailjs.init({ publicKey: EMAILJS_CONFIG.publicKey });
    emailjsReady = true;
  }
}catch(e){ console.error('EmailJS init failed:', e); }

function sendPasswordChangeEmail(shop){
  if(!shop.email){
    toast(t('cp_no_email_on_file'), 'error');
    return;
  }
  if(!emailjsReady){
    console.warn('EmailJS is not configured yet — see EMAILJS_CONFIG near the top of the script. Skipping email notification.');
    toast(t('cp_email_not_configured'), 'error');
    return;
  }
  emailjs.send(EMAILJS_CONFIG.serviceId, EMAILJS_CONFIG.templateId, {
    to_email: shop.email,
    shop_name: shop.businessName,
    changed_at: fmtDateTime(Date.now())
  }).then(function(){
    toast(t('cp_email_sent') + ': ' + shop.email, 'success');
  }).catch(function(err){
    console.error('EmailJS send failed:', err);
    toast(t('cp_email_failed'), 'error');
  });
}

function dateStr(ts){

  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

/* ---------------- Nepali (Bikram Sambat) ↔ English (AD) date sync ----------------
   Uses the nepali-date-converter library (loaded via CDN in <head>), which is
   valid for 2000–2090 BS (~1943–2033 AD) — comfortably covers any real
   purchase date. Conversion only ever touches the DOM directly (never
   state), so it can't interfere with anything the rest of the app reads —
   only the English (AD) field's value is what gets saved. */
function adDateToBsString(adStr){
  if(!adStr || !window.NepaliDate || !window.NepaliDate.default) return '';
  try{
    var d = new Date(adStr+'T00:00:00');
    if(isNaN(d.getTime())) return '';
    var nd = new window.NepaliDate.default(d);
    return nd.format('YYYY-MM-DD');
  }catch(e){ return ''; }
}
function bsDateToAdString(bsStr){
  if(!bsStr || !window.NepaliDate || !window.NepaliDate.default) return '';
  var m = bsStr.trim().match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})$/);
  if(!m) return '';
  try{
    var nd = new window.NepaliDate.default(parseInt(m[1],10), parseInt(m[2],10)-1, parseInt(m[3],10));
    var ad = nd.getAD();
    var pad = function(n){ return String(n).padStart(2,'0'); };
    return ad.year+'-'+pad(ad.month+1)+'-'+pad(ad.date);
  }catch(e){ return ''; }
}
// Renders a paired English-date-picker + Nepali-date-text-field for Purchase
// Date, wherever it's needed. Typing/picking either one live-updates the
// other — data-bs-for links the BS field back to its AD field's id.
function purchaseDateFieldHtml(adId, adValue){
  var bsValue = adDateToBsString(adValue);
  return '<div class="grid grid-2">'+
    '<div class="field-row"><label class="field-label">'+t('purchase_date')+' — '+t('date_ad_label')+'</label>'+
      '<input class="field purchase-date-ad" id="'+adId+'" type="date" value="'+escapeHtml(adValue)+'"></div>'+
    '<div class="field-row"><label class="field-label">'+t('purchase_date')+' — '+t('date_bs_label')+'</label>'+
      '<input class="field purchase-date-bs" id="'+adId+'-bs" data-bs-for="'+adId+'" placeholder="YYYY-MM-DD" value="'+escapeHtml(bsValue)+'"></div>'+
  '</div>';
}

function seedDemoSales(shop){
  var day = 24*60*60*1000;
  var now = Date.now();
  var pRice = shop.products[0], pOil = shop.products[1], pNoodle = shop.products[2], pTea = shop.products[3], pSoap = shop.products[4];
  var cust1 = shop.customers[0], cust2 = shop.customers[1];
  var seeds = [
    {daysAgo:14, payment:'cash', items:[[pRice,2],[pSoap,1]], customer:cust1},
    {daysAgo:11, payment:'qr', items:[[pOil,3],[pNoodle,2]], customer:null},
    {daysAgo:9, payment:'card', items:[[pTea,4]], customer:cust2},
    {daysAgo:6, payment:'qr', items:[[pRice,1],[pOil,1],[pSoap,2]], customer:cust1},
    {daysAgo:4, payment:'cash', items:[[pNoodle,5]], customer:null},
    {daysAgo:2, payment:'credit', items:[[pRice,3],[pTea,2]], customer:cust2},
    {daysAgo:1, payment:'qr', items:[[pSoap,3],[pNoodle,1]], customer:cust1},
    {daysAgo:0, payment:'cash', items:[[pOil,2]], customer:null},
  ];
  seeds.forEach(function(s, idx){
    var subtotal = 0;
    var items = s.items.map(function(pair){
      var p = pair[0], qty = pair[1];
      var lineTotal = p.price*qty;
      subtotal += lineTotal;
      return {productId:p.id, name:p.name, qty:qty, price:p.price, total:lineTotal};
    });
    var vat = subtotal*(shop.vatRate/100);
    var total = subtotal+vat;
    var seededInvoiceNo = nextInvoiceNo(shop);
    shop.invoiceSeq++;
    shop.sales.push({
      id: uid('inv'), invoiceNo: seededInvoiceNo, date: now - s.daysAgo*day - idx*1000,
      items:items, subtotal:subtotal, vat:vat, total:total, payment:s.payment,
      customerId: s.customer?s.customer.id:null, customerName: s.customer?s.customer.name:null
    });
  });
}

/* ---------------- data helpers ---------------- */
function sumBy(arr, key){ return arr.reduce(function(a,b){ return a + (Number(b[key])||0); }, 0); }
function filteredSales(shop, days, includeCancelled){
  if(!shop) return [];
  var list = (days==='all' || days===0) ? shop.sales.slice() : (function(){
    var cutoff = Date.now() - Number(days)*24*60*60*1000;
    return shop.sales.filter(function(s){ return s.date >= cutoff; });
  })();
  return includeCancelled ? list : list.filter(function(s){ return !s.cancelled; });
}
function todaySales(shop){
  var start = new Date(); start.setHours(0,0,0,0);
  return shop.sales.filter(function(s){ return s.date >= start.getTime() && !s.cancelled; });
}
function lowStockProducts(shop){
  return shop.products.filter(function(p){ return p.stock <= p.lowStockThreshold; });
}

// Backfills fields introduced after some shops were already saved to
// Firestore, so older records (created before Suppliers/Expiry existed)
// don't crash the UI — they just show up empty until filled in.
function normalizeShopFields(shop){
  if(!shop.suppliers) shop.suppliers = [];
  if(!shop.supplierPurchases) shop.supplierPurchases = [];
  if(shop.logoImage===undefined) shop.logoImage = null;
  if(shop.signatureImage===undefined) shop.signatureImage = null;
  if(!shop.billPrintFormat) shop.billPrintFormat = '80mm';
  if(shop.printTwoCopies===undefined) shop.printTwoCopies = false;
  (shop.products||[]).forEach(function(p){
    if(p.supplierId===undefined) p.supplierId = null;
    if(p.manufactureDate===undefined) p.manufactureDate = null;
    if(p.expiryDate===undefined) p.expiryDate = null;
    if(p.code===undefined) p.code = null;
  });
  shop.supplierPurchases.forEach(function(pur){
    if(!pur.paymentMethod) pur.paymentMethod = 'cash';
    if(pur.billNo===undefined) pur.billNo = null;
  });
  return shop;
}

// Products expiring within `withinDays` days (defaults to 30), including
// already-expired ones. Sorted soonest-to-expire first.
function expiringProducts(shop, withinDays){
  var days = withinDays===undefined ? 30 : withinDays;
  var cutoff = Date.now() + days*24*60*60*1000;
  return (shop.products||[]).filter(function(p){
    if(!p.expiryDate) return false;
    var expiryTs = new Date(p.expiryDate+'T23:59:59').getTime();
    return expiryTs <= cutoff;
  }).sort(function(a,b){ return new Date(a.expiryDate) - new Date(b.expiryDate); });
}
function daysUntil(dateStr2){
  var ms = new Date(dateStr2+'T23:59:59').getTime() - Date.now();
  return Math.ceil(ms / (24*60*60*1000));
}
function supplierName(shop, supplierId){
  var s = (shop.suppliers||[]).find(function(x){ return x.id===supplierId; });
  return s ? s.companyName : null;
}
// The most recent purchase-log entry recorded for a specific product, if any.
// Used so editing a product can show/update its existing purchase record
// instead of always creating a brand-new one.
function latestPurchaseForProduct(shop, productId){
  var entries = (shop.supplierPurchases||[]).filter(function(p){ return p.productId===productId; });
  if(entries.length===0) return null;
  return entries.slice().sort(function(a,b){ return b.date - a.date; })[0];
}
// Per-supplier totals for the Supplier Report: total invested, total units,
// and the list of individual purchase-log entries for that supplier.
function supplierReportData(shop){
  var suppliers = shop.suppliers || [];
  var purchases = shop.supplierPurchases || [];
  return suppliers.map(function(s){
    var entries = purchases.filter(function(p){ return p.supplierId===s.id; });
    var totalInvestment = sumBy(entries, 'total');
    var totalUnits = sumBy(entries, 'qty');
    var productIds = {};
    entries.forEach(function(e){ productIds[e.productId] = true; });
    return {
      supplier: s,
      entries: entries.slice().sort(function(a,b){ return b.date - a.date; }),
      totalInvestment: totalInvestment,
      totalUnits: totalUnits,
      productCount: Object.keys(productIds).length
    };
  }).sort(function(a,b){ return b.totalInvestment - a.totalInvestment; });
}

function paymentLabel(method){
  return t('pay_'+method) || method;
}
function nextInvoiceNo(shop){
  var code = (shop.businessName||'SHOP').split(' ').map(function(w){return w[0];}).join('').toUpperCase().slice(0,4);
  var seqStr = String(shop.invoiceSeq).padStart(4,'0');
  return 'INV-'+code+'-'+seqStr;
}
function topProductsFrom(sales){
  var map = {};
  sales.forEach(function(s){
    s.items.forEach(function(it){
      if(!map[it.name]) map[it.name] = {name:it.name, qty:0, revenue:0};
      map[it.name].qty += it.qty;
      map[it.name].revenue += it.total;
    });
  });
  return Object.values(map).sort(function(a,b){ return b.revenue - a.revenue; }).slice(0,6);
}
function paymentBreakdownFrom(sales){
  var map = {cash:0, qr:0, card:0, credit:0};
  sales.forEach(function(s){ map[s.payment] = (map[s.payment]||0) + s.total; });
  return map;
}
function dailyTrendFrom(sales, days){
  var n = days==='all' ? 30 : Number(days);
  var buckets = {}; var order = [];
  for(var i=n-1;i>=0;i--){
    var d = new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()-i);
    var key = d.getMonth()+1+'/'+d.getDate();
    buckets[key] = 0; order.push(key);
  }
  sales.forEach(function(s){
    var d = new Date(s.date);
    var key = (d.getMonth()+1)+'/'+d.getDate();
    if(buckets[key] !== undefined) buckets[key] += s.total;
  });
  return { labels: order, values: order.map(function(k){ return Math.round(buckets[k]); }) };
}

function renderShopMain(){
  var body = '';
  switch(state.shopView){
    case 'inventory': body = renderInventoryView(); break;
    case 'suppliers': body = renderSuppliersView(); break;
    case 'billing': body = renderBillingView(); break;
    case 'reports': body = renderReportsView(); break;
    case 'customers': body = renderCustomersView(); break;
    case 'settings': body = renderSettingsView(); break;
    case 'detailedReports': body = renderDetailedReportsView(); break;
    default: body = renderDashboardView();
  }
  if(state.showAddProductModal) body += renderProductModal();
  if(state.showBulkAddModal) body += renderBulkAddProductsModal();
  if(state.showAddStockModal) body += renderAddStockModal();
  if(state.showAddCustomerModal) body += renderCustomerModal();
  if(state.showBillsListModal) body += renderBillsListModal();
  if(state.showEditBillModal) body += renderEditBillModal();
  if(state.showAddSupplierModal) body += renderSupplierModal();
  if(state.showEditPurchaseModal) body += renderEditPurchaseModal();
  if(state.showReceiptModal && state.lastInvoice) body += renderReceiptModal();
  return body;
}

/* ---------------- shop admin: dashboard ---------------- */
function renderDashboardView(){
  var shop = currentShop();
  var tSales = todaySales(shop);
  var tTotal = sumBy(tSales, 'total');
  var mSales = filteredSales(shop, 30);
  var mTotal = sumBy(mSales, 'total');
  var low = lowStockProducts(shop);
  var expiring = expiringProducts(shop, 30);
  var recent = shop.sales.slice(-6).reverse();

  var recentRows = recent.length ? recent.map(function(s){
    return '<tr'+(s.cancelled ? ' style="opacity:0.55;"' : '')+'><td style="font-family:var(--font-mono);">'+s.invoiceNo+'</td><td>'+fmtDateTime(s.date)+'</td><td>'+escapeHtml(s.customerName||t('bill_customer_walkin'))+'</td>'+

  }).join('') : '';

    '<div class="stat-card accent-success"><div class="label">'+t('stat_customers')+'</div><div class="value">'+shop.customers.length+'</div><div class="foot">'+t('shop_card_login')+': '+escapeHtml(shop.adminUsername)+'</div></div>'+

/* ---------------- shop admin: inventory ---------------- */

  var products = shop.products.filter(function(p){ return !q || p.name.toLowerCase().indexOf(q)>=0 || p.category.toLowerCase().indexOf(q)>=0; });

  var rows = products.map(function(p){
    var status = p.stock===0 ? 'out' : (p.stock<=p.lowStockThreshold ? 'low' : 'ok');
    var badge = status==='out' ? '<span class="badge badge-danger">'+t('status_out')+'</span>' : status==='low' ? '<span class="badge badge-warning">'+t('status_low')+'</span>' : '<span class="badge badge-success">'+t('status_ok')+'</span>';

      '<td style="font-family:var(--font-mono);color:var(--ink-soft);">'+(p.code?escapeHtml(p.code):'—')+'</td>'+
      '<td><div style="font-weight:700;">'+escapeHtml(p.name)+'</div><div class="muted" style="font-size:11px;">'+fmtMoney(p.cost)+' '+(state.lang==='np'?'लागत':'cost')+'</div></td>'+
      '<td><span class="tag-pill">'+escapeHtml(p.category)+'</span></td>'+
      '<td style="font-weight:600;">'+fmtMoney(p.price)+'</td>'+
      '<td>'+p.stock+' <span class="muted">'+escapeHtml(p.unit)+'</span></td>'+
      '<td>'+badge+'</td>'+
      '<td><div style="display:flex;gap:6px;">'+
        '<button class="btn btn-outline btn-sm" data-action="open-add-stock" data-id="'+p.id+'">'+t('btn_restock')+'</button>'+
        '<button class="btn btn-outline btn-sm" data-action="open-edit-product" data-id="'+p.id+'">'+t('btn_edit')+'</button>'+
        '<button class="btn btn-outline btn-sm" data-action="remove-product" data-id="'+p.id+'" style="color:var(--danger);">&times;</button>'+
      '</div></td>'+

  }).join('');

  return ''+
  '<div class="page-head"><div><h1>'+t('inv_title')+'</h1><div class="sub">'+t('inv_sub')+'</div></div>'+
    '<div style="display:flex;gap:8px;">'+
      '<button class="btn btn-primary" data-action="open-bulk-add-products">&#128203; '+t('btn_bulk_add_products')+'</button>'+

  (shop.products.length===0 ? '<div class="card empty-state"><div class="ic">&#128230;</div>'+t('inv_empty')+'<div style="margin-top:12px;"><button class="btn btn-primary" data-action="open-bulk-add-products">&#128203; '+t('btn_bulk_add_products')+'</button></div></div>' :

  (rows || '<tr><td colspan="7" class="empty-state">No matches.</td></tr>')+

function renderProductModal(){
  var shop = currentShop();
  var editing = state.editingProductId ? shop.products.find(function(p){return p.id===state.editingProductId;}) : null;
  var p = editing || {code:'',name:'',category:'',unit:'pcs',price:'',cost:'',stock:0,lowStockThreshold:5,manufactureDate:'',expiryDate:''};
  var mode = state.productModalSupplierMode || 'none';
  var selectedSupplier = mode==='existing' ? (shop.suppliers||[]).find(function(s){return s.id===state.productModalSelectedSupplierId;}) : null;
  var supplierOptions = '<option value="none" '+(mode==='none'?'selected':'')+'>'+t('supplier_none')+'</option>'+
    '<option value="new" '+(mode==='new'?'selected':'')+'>'+t('supplier_add_new')+'</option>'+
    (shop.suppliers||[]).map(function(s){
      return '<option value="'+s.id+'" '+(mode==='existing'&&state.productModalSelectedSupplierId===s.id?'selected':'')+'>'+escapeHtml(s.companyName)+'</option>';
    }).join('');
  var supField = function(id, key, val, disabled){
    return '<div class="field-row"><label class="field-label">'+t(key)+'</label><input class="field" id="'+id+'" value="'+escapeHtml(val||'')+'" '+(disabled?'disabled style="background:var(--surface-2);"':'')+'></div>';
  };
  var sv = function(k){ return selectedSupplier ? selectedSupplier[k] : ''; };
  // When editing, prefill Purchase Date/Total Amount from this product's most
  // recent purchase-log entry (if one exists), so corrections update that
  // record instead of silently creating a duplicate.
  var latestPurchase = null;
  if(editing){
    var productPurchases = (shop.supplierPurchases||[]).filter(function(e){ return e.productId===editing.id; });
    if(productPurchases.length){
      latestPurchase = productPurchases.sort(function(a,b){ return b.date - a.date; })[0];
    }
  }
  var purchaseDateValue = latestPurchase ? dateStr(latestPurchase.date) : dateStr(Date.now());
  var totalAmountValue = latestPurchase ? latestPurchase.total : '';
  return ''+
  '<div class="modal-backdrop" data-action="backdrop-close" data-modal="product">'+
    '<div class="modal" style="max-width:560px;" data-stop>'+
      '<div class="modal-head"><h3>'+t('edit_product_title')+'</h3><button class="modal-close" data-action="close-product-modal">&times;</button></div>'+
      '<div class="modal-body">'+
        '<div style="font-weight:700;font-size:13px;margin-bottom:10px;">'+t('supplier_details_section')+'</div>'+
        '<div class="field-row"><label class="field-label">'+t('supplier_select_label')+'</label>'+
          '<select class="field" id="pm-supplier-select">'+supplierOptions+'</select>'+
        '</div>'+
        (mode==='none' ? '' : ''+
          '<div class="grid grid-2">'+
            supField('pm-sup-company','supplier_company_name', mode==='existing'?sv('companyName'):'', mode==='existing')+
            supField('pm-sup-owner','supplier_owner_name', mode==='existing'?sv('ownerName'):'', mode==='existing')+
          '</div>'+
          '<div class="grid grid-2">'+
            supField('pm-sup-email','field_email', mode==='existing'?sv('email'):'', mode==='existing')+
            supField('pm-sup-tax','supplier_tax_number', mode==='existing'?sv('taxNumber'):'', mode==='existing')+
          '</div>'+
          supField('pm-sup-location','supplier_location', mode==='existing'?sv('location'):'', mode==='existing')+
          (mode==='existing' ? '<div class="field-hint">'+t('supplier_existing_hint')+'</div>' : '')+
          purchaseDateFieldHtml('pm-purchase-date', purchaseDateValue)+
          '<div class="field-row">'+
            '<label class="field-label">'+t('total_amount')+'</label><input class="field" id="pm-total-amount" type="number" placeholder="0.00" value="'+escapeHtml(totalAmountValue===''?'':String(totalAmountValue))+'">'+
            '<div class="field-hint">'+t('total_amount_hint')+'</div>'+
          '</div>'+
          '<div class="field-row" style="max-width:220px;">'+
            '<label class="field-label">'+t('bill_payment')+'</label>'+
            '<select class="field" id="pm-purchase-payment">'+
              ['cash','qr','card','credit'].map(function(m){
                return '<option value="'+m+'" '+((latestPurchase?latestPurchase.paymentMethod:'cash')===m?'selected':'')+'>'+paymentLabel(m)+'</option>';
              }).join('')+
            '</select>'+
          '</div>'+
          '<div class="field-row">'+
            '<label class="field-label">'+t('bill_attachment')+'</label>'+
            '<input class="field" id="pm-bill-file" type="file" accept="application/pdf,image/*">'+
            (latestPurchase && latestPurchase.billAttachment ?
              '<div class="field-hint">'+t('bill_attachment_current')+' <a href="'+latestPurchase.billAttachment+'" download="'+escapeHtml(latestPurchase.billFileName||'bill')+'" target="_blank" style="color:var(--indigo);font-weight:600;">'+escapeHtml(latestPurchase.billFileName||t('bill_view'))+'</a> — '+t('bill_attachment_replace_hint')+'</div>'
              : '<div class="field-hint">'+t('bill_attachment_hint')+'</div>')+
          '</div>'+
        '')+
        '<hr class="hair">'+
        '<div class="grid grid-2">'+
          '<div class="field-row"><label class="field-label">'+t('product_code')+'</label><input class="field" id="pm-code" value="'+escapeHtml(p.code||'')+'" placeholder="'+t('product_code_placeholder')+'"></div>'+
          '<div class="field-row"><label class="field-label">'+t('product_name')+'</label><input class="field" id="pm-name" list="pm-product-names-datalist" value="'+escapeHtml(p.name)+'"></div>'+
        '</div>'+

/* ---------------- inventory: bulk add products from a single supplier bill ---------------- */
// Builds <option> entries for a product-name datalist: every existing
// product name plus, if extraRows is given, any name already typed into
// another row in the same in-progress form — so a name typed for one item
// is immediately reusable/suggested for the next, without waiting to save.
function productNameDatalistOptions(shop, extraRows){
  var names = {};
  (shop.products||[]).forEach(function(p){ if(p.name) names[p.name] = true; });
  (extraRows||[]).forEach(function(r){ if(r.name && r.name.trim()) names[r.name.trim()] = true; });
  return Object.keys(names).sort().map(function(n){ return '<option value="'+escapeHtml(n)+'">'; }).join('');
}

function newBulkAddRow(){
  return { id: uid('row'), code:'', name:'', category:'', unit:'pcs', qty:'', cost:'', price:'', lowStockThreshold:'5', manufactureDate:'', expiryDate:'' };
}

// Reads whatever is currently typed into each row's inputs back into
// state.bulkAddItems. Must run before any action that re-renders the modal
// (adding/removing a row, changing supplier) so in-progress rows aren't lost.
function syncBulkAddRowsFromDOM(){
  state.bulkAddItems.forEach(function(row){
    var g = function(suffix){ var el = document.getElementById('ba-'+suffix+'-'+row.id); return el ? el.value : ''; };
    row.code = g('code'); row.name = g('name'); row.category = g('category'); row.unit = g('unit') || 'pcs';
    row.qty = g('qty'); row.cost = g('cost'); row.price = g('price');
    row.lowStockThreshold = g('lowstock'); row.manufactureDate = g('mfgdate'); row.expiryDate = g('expdate');
  });
}

/* ---------------- shop admin: billing / POS ---------------- */
function renderBillingView(){
  var shop = currentShop();
  var cart = state.cart;
  var lines = cart.map(function(item){
    var p = shop.products.find(function(x){return x.id===item.productId;});
    if(!p) return '';
    var lineTotal = p.price * item.qty;
    return '<tr>'+
      '<td><div style="font-weight:600;">'+escapeHtml(p.name)+'</div><div class="muted" style="font-size:11px;">'+p.stock+' '+escapeHtml(p.unit)+' '+(state.lang==='np'?'बाँकी':'in stock')+'</div></td>'+
      '<td style="width:110px;"><div style="display:flex;align-items:center;gap:6px;">'+
        '<button class="btn btn-outline btn-sm" data-action="cart-dec" data-id="'+p.id+'" style="padding:3px 9px;">−</button>'+
        '<span style="min-width:20px;text-align:center;font-weight:700;">'+item.qty+'</span>'+
        '<button class="btn btn-outline btn-sm" data-action="cart-inc" data-id="'+p.id+'" style="padding:3px 9px;">+</button>'+
      '</div></td>'+
      '<td>'+fmtMoney(p.price)+'</td>'+
      '<td style="font-weight:700;">'+fmtMoney(lineTotal)+'</td>'+
      '<td><button class="btn btn-outline btn-sm" data-action="cart-remove" data-id="'+p.id+'" style="color:var(--danger);">&times;</button></td>'+
    '</tr>';
  }).join('');

  var subtotal = cart.reduce(function(sum,item){
    var p = shop.products.find(function(x){return x.id===item.productId;});
    return sum + (p ? p.price*item.qty : 0);
  }, 0);
  var discountType = state.billingDiscountType || 'flat';
  var discountValueRaw = Number(state.billingDiscountValue) || 0;
  var discountAmount = discountType==='percent' ? subtotal*(discountValueRaw/100) : discountValueRaw;
  if(discountAmount > subtotal) discountAmount = subtotal;
  if(discountAmount < 0) discountAmount = 0;
  var netSubtotal = subtotal - discountAmount;
  var vat = netSubtotal * (shop.vatRate/100);
  var total = netSubtotal + vat;

  var productOptions = '<option value="">'+t('bill_select_product')+'</option>' + shop.products
    .filter(function(p){ return p.stock>0; })
    .map(function(p){
      return '<option value="'+p.id+'">'+escapeHtml(p.name)+' — '+fmtMoney(p.price)+' ('+p.stock+' '+escapeHtml(p.unit)+')</option>';
    }).join('');

  var customerOptions = '<option value="">'+t('bill_customer_walkin')+'</option>' + shop.customers.map(function(c){
    return '<option value="'+c.id+'" '+(state.billingCustomerId===c.id?'selected':'')+'>'+escapeHtml(c.name)+' — '+escapeHtml(c.phone)+'</option>';
  }).join('');

  var payMethods = ['cash','qr','card','credit'];
  var generateBtnLabel = shop.taxType==='pan' ? t('bill_generate_pan') : t('bill_generate_vat');

  return ''+
  '<div class="page-head"><div><h1>'+t('bill_title')+'</h1><div class="sub">'+t('bill_sub')+'</div></div></div>'+
  '<div class="grid grid-billing">'+
    '<div>'+
      '<div class="card card-pad" style="margin-bottom:14px;">'+
        '<label class="field-label">'+t('bill_select_product_label')+'</label>'+
        '<div style="display:flex;gap:8px;">'+
          '<select class="field" id="billing-product-select">'+productOptions+'</select>'+
          '<button type="button" class="btn btn-indigo" style="white-space:nowrap;" data-action="add-selected-product">+ '+t('bill_add_to_bill')+'</button>'+
        '</div>'+
        (shop.products.filter(function(p){return p.stock>0;}).length===0 ? '<div class="field-hint">'+t('bill_no_products_in_stock')+'</div>' : '')+
      '</div>'+
      '<div class="card">'+
        '<div class="card-pad" style="padding-bottom:0;"><h3 style="margin:0;font-size:15px;">'+t('bill_cart')+'</h3></div>'+
        (cart.length ? '<div class="table-wrap" style="border:none;margin-top:10px;"><table><thead><tr><th>'+t('th_product')+'</th><th>'+t('bill_qty')+'</th><th>'+t('bill_price')+'</th><th>'+t('bill_line_total')+'</th><th></th></tr></thead><tbody>'+lines+'</tbody></table></div>'
          : '<div class="empty-state">'+t('bill_cart_empty')+'</div>')+
      '</div>'+
    '</div>'+
    '<div class="card card-pad">'+
      '<div class="field-row"><label class="field-label">'+t('bill_customer')+'</label><select class="field" id="bill-customer" data-action="set-billing-customer">'+customerOptions+'</select>'+
        '<button class="btn btn-outline btn-sm" style="margin-top:8px;" data-action="open-add-customer">'+t('bill_new_customer')+'</button></div>'+
      '<div class="field-row"><label class="field-label">'+t('bill_payment')+'</label>'+
        '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">'+
        payMethods.map(function(m){
          return '<button class="btn btn-sm '+(state.billingPayment===m?'btn-indigo':'btn-outline')+'" data-action="set-payment" data-method="'+m+'" style="justify-content:center;">'+paymentLabel(m)+'</button>';
        }).join('')+
        '</div>'+
      '</div>'+
      '<div class="field-row">'+
        '<label class="field-label">'+t('bill_discount')+'</label>'+
        '<div style="display:flex;gap:8px;">'+
          '<select class="field" id="billing-discount-type" style="max-width:110px;">'+
            '<option value="flat" '+(discountType==='flat'?'selected':'')+'>'+t('bill_discount_flat')+'</option>'+
            '<option value="percent" '+(discountType==='percent'?'selected':'')+'>'+t('bill_discount_percent')+'</option>'+
          '</select>'+
          '<input class="field" id="billing-discount-value" type="number" min="0" step="0.01" value="'+(discountValueRaw||'')+'" placeholder="0">'+
        '</div>'+
      '</div>'+
      '<hr class="hair">'+
      '<div class="kv"><div class="k">'+t('bill_subtotal')+'</div><div class="v">'+fmtMoney(subtotal)+'</div></div>'+
      (discountAmount>0 ? '<div class="kv"><div class="k" style="color:var(--success);">'+t('bill_discount')+(discountType==='percent'?' ('+discountValueRaw+'%)':'')+'</div><div class="v" style="color:var(--success);">−'+fmtMoney(discountAmount)+'</div></div>' : '')+
      (shop.taxType==='pan' ? '' : '<div class="kv"><div class="k">'+t('bill_vat')+' ('+shop.vatRate+'%)</div><div class="v">'+fmtMoney(vat)+'</div></div>')+
      '<div class="kv" style="font-size:16px;"><div class="k" style="color:var(--ink);font-weight:700;">'+t('bill_total')+'</div><div class="v" style="color:var(--crimson-dark);">'+fmtMoney(total)+'</div></div>'+
      '<button class="btn btn-primary" style="width:100%;justify-content:center;padding:12px;margin-top:14px;font-size:14px;" data-action="generate-bill" '+(cart.length===0?'disabled':'')+'>&#128196; '+generateBtnLabel+'</button>'+
    '</div>'+
  '</div>';
}

  '</div>'+

      '<span class="ic">&#128666;</span><span>'+t('suppliers_tab_manage')+'</span>'+
    '</button>'+
    '<button data-action="supplier-subview" data-view="report" class="supplier-section-tab '+(state.supplierSubView==='report'?'active':'')+'">'+
      '<span class="ic">&#128202;</span><span>'+t('suppliers_tab_report')+'</span>'+
    '</button>'+
  '</div>';

  if(state.supplierSubView==='report'){
    var report = supplierReportData(shop);
    var grandTotal = sumBy(report.map(function(r){return {total:r.totalInvestment};}), 'total');
    body += '<div class="grid grid-3" style="margin-bottom:18px;">'+
      '<div class="stat-card accent-crimson"><div class="label">'+t('sup_rep_total_investment')+'</div><div class="value">'+fmtMoney(grandTotal)+'</div></div>'+
      '<div class="stat-card accent-indigo"><div class="label">'+t('sup_rep_total_suppliers')+'</div><div class="value">'+(shop.suppliers||[]).length+'</div></div>'+
      '<div class="stat-card accent-gold"><div class="label">'+t('sup_rep_total_purchases')+'</div><div class="value">'+(shop.supplierPurchases||[]).length+'</div></div>'+
    '</div>';
    if(report.length===0){
      body += '<div class="card empty-state"><div class="ic">&#128666;</div>'+t('suppliers_empty')+'</div>';
    } else {
      body += report.map(function(r){
        var rows = r.entries.map(function(e){
          var linkedProduct = shop.products.find(function(p){ return p.id===e.productId; });
          var codeDisplay = linkedProduct && linkedProduct.code ? '<span class="tag-pill" style="font-family:var(--font-mono);">'+escapeHtml(linkedProduct.code)+'</span>' : '—';
          return '<tr><td>'+fmtDate(e.date)+'</td><td style="font-family:var(--font-mono);">'+escapeHtml(e.billNo||'—')+'</td><td>'+codeDisplay+'</td><td>'+escapeHtml(e.productName)+'</td><td>'+e.qty+'</td><td>'+fmtMoney(e.costPrice)+'</td><td style="font-weight:700;">'+fmtMoney(e.total)+'</td>'+
            '<td>'+(e.billAttachment ? '<a href="'+e.billAttachment+'" download="'+escapeHtml(e.billFileName||'bill')+'" target="_blank" style="color:var(--indigo);font-weight:600;">&#128206; '+t('bill_view')+'</a>' : '—')+'</td>'+
            '<td><button type="button" class="btn btn-outline btn-sm" data-action="open-edit-purchase" data-id="'+e.id+'">'+t('btn_edit')+'</button></td></tr>';
        }).join('');
        return '<div class="card" style="margin-bottom:16px;">'+
          '<div class="card-pad" style="padding-bottom:12px;">'+
            '<div class="flex-between">'+
              '<div><div style="font-weight:700;font-size:15px;">'+escapeHtml(r.supplier.companyName)+'</div>'+
              '<div class="muted" style="font-size:12px;">'+escapeHtml(r.supplier.ownerName||'')+' · '+escapeHtml(r.supplier.location||'')+'</div></div>'+
              '<div style="text-align:right;"><div style="font-family:var(--font-display);font-size:19px;font-weight:700;color:var(--crimson-dark);">'+fmtMoney(r.totalInvestment)+'</div>'+
              '<div class="muted" style="font-size:11px;">'+r.totalUnits+' '+t('sup_rep_units')+' · '+r.productCount+' '+t('sup_rep_products')+'</div></div>'+
            '</div>'+
          '</div>'+
          (r.entries.length ? '<div class="table-wrap" style="border:none;"><table><thead><tr><th>'+t('invoice_date')+'</th><th>'+t('bulk_add_bill_no')+'</th><th>'+t('product_code')+'</th><th>'+t('th_product')+'</th><th>'+t('bill_qty')+'</th><th>'+t('sup_rep_unit_cost')+'</th><th>'+t('bill_line_total')+'</th><th>'+t('bill_attachment')+'</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div>'
            : '<div class="empty-state" style="padding:16px;">'+t('sup_rep_no_purchases')+'</div>')+
        '</div>';
      }).join('');
    }
    return body;
  }

  // Manage Suppliers tab
  var suppliers = shop.suppliers || [];
  if(suppliers.length===0){
    body += '<div class="card empty-state"><div class="ic">&#128666;</div>'+t('suppliers_empty')+'</div>';
  } else {
    var rows = suppliers.map(function(s){
      var productCount = shop.products.filter(function(p){ return p.supplierId===s.id; }).length;
      return '<tr>'+
        '<td><div style="font-weight:700;">'+escapeHtml(s.companyName)+'</div><div class="muted" style="font-size:11px;">'+escapeHtml(s.ownerName||'')+'</div></td>'+
        '<td>'+escapeHtml(s.email||'—')+'</td>'+
        '<td style="font-family:var(--font-mono);">'+escapeHtml(s.taxNumber||'—')+'</td>'+
        '<td>'+escapeHtml(s.location||'—')+'</td>'+
        '<td>'+productCount+'</td>'+
        '<td><div style="display:flex;gap:6px;">'+
          '<button class="btn btn-outline btn-sm" data-action="open-edit-supplier" data-id="'+s.id+'">'+t('btn_edit')+'</button>'+
          '<button class="btn btn-outline btn-sm" data-action="remove-supplier" data-id="'+s.id+'" style="color:var(--danger);">&times;</button>'+
        '</div></td>'+
      '</tr>';
    }).join('');
    body += '<div class="table-wrap"><table><thead><tr>'+
      '<th>'+t('supplier_company_name')+'</th><th>'+t('field_email')+'</th><th>'+t('supplier_tax_number')+'</th><th>'+t('shop_location')+'</th><th>'+t('suppliers_products_col')+'</th><th>'+t('th_actions')+'</th>'+
    '</tr></thead><tbody>'+rows+'</tbody></table></div>';
  }
  return body;
}

function renderReportsView(){

  var avg = sales.length ? total/sales.length : 0;
  var pay = paymentBreakdownFrom(sales);
  var top = topProductsFrom(sales);

  var ranges = [['7','range_7'],['30','range_30'],['90','range_90'],['all','range_all']];
  var rangeBtns = ranges.map(function(r){
    return '<button class="btn btn-sm '+(state.repRange===r[0]?'btn-indigo':'btn-outline')+'" data-action="set-range" data-range="'+r[0]+'">'+t(r[1])+'</button>';

  var topRows = top.length ? top.map(function(p,i){
    return '<tr><td>'+(i+1)+'.</td><td style="font-weight:600;">'+escapeHtml(p.name)+'</td><td>'+p.qty+'</td><td style="font-weight:700;">'+fmtMoney(p.revenue)+'</td></tr>';
  }).join('') : '<tr><td colspan="4" class="empty-state">'+t('rep_no_data')+'</td></tr>';

  var payRows = ['cash','qr','card','credit'].map(function(m){

    '</div>';

  return ''+
  '<div class="page-head"><div><h1>'+t('rep_title')+'</h1><div class="sub">'+t('rep_sub')+'</div></div>'+
    '<div style="display:flex;gap:6px;">'+rangeBtns+'</div></div>'+

    '<div class="stat-card accent-crimson"><div class="label">'+t('rep_total_sales')+'</div><div class="value">'+fmtMoney(total)+'</div></div>'+
    '<div class="stat-card accent-gold"><div class="label">'+t('rep_total_vat')+'</div><div class="value">'+fmtMoney(vatTotal)+'</div></div>'+
    '<div class="stat-card accent-indigo" style="cursor:pointer;" data-action="open-bills-list" title="'+t('rep_bills_click_hint')+'"><div class="label">'+t('rep_bills')+' &#128065;</div><div class="value">'+sales.length+'</div><div class="foot">'+t('rep_bills_click_hint')+'</div></div>'+
    '<div class="stat-card accent-success"><div class="label">'+t('rep_avg_bill')+'</div><div class="value">'+fmtMoney(avg)+'</div></div>'+
  '</div>'+
  '<div class="grid grid-2" style="align-items:start;">'+
    '<div class="card card-pad">'+
      '<h3 style="margin:0 0 12px;font-size:15px;">'+t('rep_trend')+'</h3>'+
      (sales.length ? '<canvas id="trendChart" height="180"></canvas>' : '<div class="empty-state">'+t('rep_no_data')+'</div>')+
    '</div>'+

      '<div class="card card-pad" style="margin-bottom:16px;">'+

/* ---------------- shop admin: Reports (detailed sales & purchases, printable) ---------------- */
// Shared data builder used by the on-screen table, the printable
// letterhead, and both PDF/Excel exports — one source of truth so all
// four outputs always show identical figures.
function getDetailedReportData(shop, type, range){
  var refColLabel = type==='sales' ? t('invoice_no') : (type==='credit' ? t('invoice_no') : t('detailed_rep_ref_col'));
  var nameColLabel = type==='purchases' ? t('detailed_rep_supplier_col') : t('bill_customer');
  var tableRows = [], total = 0, count = 0;

  if(type==='sales'){
    var sales = filteredSales(shop, range).slice().sort(function(a,b){ return b.date - a.date; });
    count = sales.length;
    total = sumBy(sales, 'total');
    tableRows = sales.map(function(s){
      return [s.invoiceNo, fmtDate(s.date), s.customerName||t('bill_customer_walkin'), paymentLabel(s.payment), s.total];
    });
  } else if(type==='credit'){
    // Outstanding customer credit: sales taken on "Credit (Due)" — money
    // owed to the shop, not yet collected.
    var creditSales = filteredSales(shop, range).filter(function(s){ return s.payment==='credit'; }).slice().sort(function(a,b){ return b.date - a.date; });
    count = creditSales.length;
    total = sumBy(creditSales, 'total');
    tableRows = creditSales.map(function(s){
      return [s.invoiceNo, fmtDate(s.date), s.customerName||t('bill_customer_walkin'), paymentLabel(s.payment), s.total];
    });
  } else {
    var purchases = (shop.supplierPurchases||[]).filter(function(p){
      if(range==='all') return true;
      return p.date >= Date.now() - Number(range)*24*60*60*1000;
    }).slice().sort(function(a,b){ return b.date - a.date; });
    count = purchases.length;
    total = sumBy(purchases, 'total');
    tableRows = purchases.map(function(p){
      var supName = supplierName(shop, p.supplierId) || '—';
      var ref = 'PUR-' + p.id.slice(-6).toUpperCase();
      var linkedProduct = shop.products.find(function(x){ return x.id===p.productId; });
      var productLabel = (linkedProduct && linkedProduct.code ? '['+linkedProduct.code+'] ' : '') + (p.productName||'—');
      // Positions 0-4 stay exactly as before (ref, date, name, payment, total)
      // so nothing that already reads those indices breaks; product label
      // and the entry's own id are appended for the on-screen table/exports
      // that know to look for them, and for the Edit button's data-id.
      return [ref, fmtDate(p.date), supName, paymentLabel(p.paymentMethod||'cash'), p.total, productLabel, p.id];
    });
  }

  return { refColLabel:refColLabel, nameColLabel:nameColLabel, tableRows:tableRows, total:total, count:count };
}

var RANGE_LABEL_MAP = {'7':'range_7','30':'range_30','90':'range_90','all':'range_all'};
function reportTypeLabel(type){
  if(type==='purchases') return t('detailed_rep_tab_purchases');
  if(type==='credit') return t('detailed_rep_tab_credit');
  return t('detailed_rep_tab_sales');
}
function safeFileSlug(name){
  return (name||'shop').replace(/[^a-zA-Z0-9]+/g,'_').replace(/^_+|_+$/g,'') || 'shop';
}

function downloadReportAsPdf(shop, type, range){
  if(!window.jspdf || !window.jspdf.jsPDF){
    toast(t('report_export_lib_missing'), 'error');
    return;
  }
  var data = getDetailedReportData(shop, type, range);
  var doc = new window.jspdf.jsPDF();
  var pageWidth = doc.internal.pageSize.getWidth();
  var y = 18;

  doc.setFontSize(16); doc.setFont(undefined, 'bold');
  doc.text(shop.businessName || '', pageWidth/2, y, {align:'center'});
  y += 6;
  doc.setFontSize(10); doc.setFont(undefined, 'normal');
  doc.text(shop.address || shop.location || '', pageWidth/2, y, {align:'center'});
  y += 5;
  doc.text((t('invoice_pan')+': '+(shop.pan||'')), pageWidth/2, y, {align:'center'});
  y += 9;

  doc.setFontSize(13); doc.setFont(undefined, 'bold');
  var titleText = reportTypeLabel(type) + ' ' + t('nav_detailed_reports');
  doc.text(titleText, pageWidth/2, y, {align:'center'});
  y += 6;
  doc.setFontSize(9); doc.setFont(undefined, 'normal');
  doc.text(t('rep_range')+': '+t(RANGE_LABEL_MAP[range]||'range_30')+'   |   '+t('detailed_rep_record_count')+': '+data.count, pageWidth/2, y, {align:'center'});
  y += 6;

  var showProductCol = type==='purchases';
  var head = showProductCol
    ? [[data.refColLabel, t('invoice_date'), t('th_product'), data.nameColLabel, t('bill_payment'), t('bill_line_total')]]
    : [[data.refColLabel, t('invoice_date'), data.nameColLabel, t('bill_payment'), t('bill_line_total')]];
  var body = data.tableRows.map(function(r){
    return showProductCol ? [r[0], r[1], r[5], r[2], r[3], fmtMoney(r[4])] : [r[0], r[1], r[2], r[3], fmtMoney(r[4])];
  });

  doc.autoTable({
    startY: y,
    head: head,
    body: body,
    foot: showProductCol ? [['', '', '', '', t('bill_total'), fmtMoney(data.total)]] : [['', '', '', t('bill_total'), fmtMoney(data.total)]],
    styles: { fontSize:8.5 },
    headStyles: { fillColor:[22,48,92] },
    footStyles: { fillColor:[245,235,215], textColor:[20,20,20], fontStyle:'bold' }
  });

  doc.save(safeFileSlug(shop.businessName)+'_'+type+'_report.pdf');
  toast(t('report_downloaded'), 'success');
}

function downloadReportAsExcel(shop, type, range){
  if(!window.XLSX){
    toast(t('report_export_lib_missing'), 'error');
    return;
  }
  var data = getDetailedReportData(shop, type, range);
  var aoa = [];
  aoa.push([shop.businessName || '']);
  aoa.push([shop.address || shop.location || '']);
  aoa.push([t('invoice_pan')+': '+(shop.pan||'')]);
  aoa.push([]);
  aoa.push([reportTypeLabel(type) + ' ' + t('nav_detailed_reports')]);
  aoa.push([t('rep_range')+': '+t(RANGE_LABEL_MAP[range]||'range_30'), t('detailed_rep_record_count')+': '+data.count]);
  aoa.push([]);
  var showProductCol = type==='purchases';
  aoa.push(showProductCol
    ? [data.refColLabel, t('invoice_date'), t('th_product'), data.nameColLabel, t('bill_payment'), t('bill_line_total')]
    : [data.refColLabel, t('invoice_date'), data.nameColLabel, t('bill_payment'), t('bill_line_total')]);
  data.tableRows.forEach(function(r){
    aoa.push(showProductCol ? [r[0], r[1], r[5], r[2], r[3], r[4]] : [r[0], r[1], r[2], r[3], r[4]]);
  });
  aoa.push(showProductCol ? ['', '', '', '', t('bill_total'), data.total] : ['', '', '', t('bill_total'), data.total]);

  var ws = window.XLSX.utils.aoa_to_sheet(aoa);
  ws['!cols'] = showProductCol
    ? [{wch:18},{wch:12},{wch:26},{wch:20},{wch:14},{wch:14}]
    : [{wch:18},{wch:12},{wch:24},{wch:14},{wch:14}];
  var wb = window.XLSX.utils.book_new();
  window.XLSX.utils.book_append_sheet(wb, ws, type==='sales' ? 'Sales' : 'Purchases');
  window.XLSX.writeFile(wb, safeFileSlug(shop.businessName)+'_'+type+'_report.xlsx');
  toast(t('report_downloaded'), 'success');
}
