function reRenderKeepFocus(){
  var active = document.activeElement;
  var id = active && active.id;
  var selStart = active && typeof active.selectionStart === 'number' ? active.selectionStart : null;
  render();
  if(id){
    var el = document.getElementById(id);
    if(el){
      el.focus();
      if(selStart!=null && el.setSelectionRange){ try{ el.setSelectionRange(selStart, selStart); }catch(e){} }
    }
  }
}

// Re-renders while keeping one or more scrollable containers (identified
// by element id) at the scroll position they were at beforehand — without
// this, a full render() rebuilds the DOM and every scroll position resets
// to the top. Pass scrollToBottomId to instead snap that one container to
// its new bottom (e.g. so a freshly added row is immediately visible).
function reRenderKeepScroll(idsToPreserve, scrollToBottomId){
  var positions = {};
  (idsToPreserve||[]).forEach(function(id){
    var el = document.getElementById(id);
    if(el) positions[id] = el.scrollTop;
  });
  render();
  Object.keys(positions).forEach(function(id){
    var el = document.getElementById(id);
    if(el) el.scrollTop = positions[id];
  });
  if(scrollToBottomId){
    var bottomEl = document.getElementById(scrollToBottomId);
    if(bottomEl) bottomEl.scrollTop = bottomEl.scrollHeight;
  }
}

/* ---------------- auth ----------------
   Single unified login: tries Super Admin credentials first, then
   falls back to matching a Shop Admin account, so the person never
   has to pick a role — the app figures out which account it is. */
function attemptLogin(username, password){
  if(username===SUPER_CREDS.username && password===SUPER_CREDS.password){
    state.currentUser = {role:'super'};
    state.superView = 'shops';
    state.loginError = '';
    render();
    return;
  }
  var shop = state.shops.find(function(s){ return s.adminUsername===username && s.adminPassword===password && s.active!==false; });
  if(shop){
    state.currentUser = {role:'shop', shopId:shop.id};
    state.shopView = 'dashboard';
    state.cart = [];
    state.loginError = '';
    render();
    return;
  }
  state.loginError = t('login_error_creds');
  render();
}

/* ---------------- modal close helper ---------------- */
function closeModalByName(name){
  if(name==='create-shop') state.showCreateShopModal = false;
  else if(name==='edit-shop'){ state.showEditShopModal = null; state.revealEditShopPassword = false; }
  else if(name==='delete-shop'){ state.showDeleteShopModal = null; state.deleteShopConfirmInput = ''; }
  else if(name==='reset-shop'){ state.showResetShopModal = null; state.resetShopConfirmInput = ''; }
  else if(name==='product'){ state.showAddProductModal = false; state.editingProductId = null; state.productModalSupplierMode = 'none'; state.productModalSelectedSupplierId = ''; }
  else if(name==='bulk-add'){ state.showBulkAddModal = false; state.bulkAddSupplierMode = 'none'; state.bulkAddSelectedSupplierId = ''; state.bulkAddItems = []; }
  else if(name==='stock') state.showAddStockModal = null;
  else if(name==='customer') state.showAddCustomerModal = false;
  else if(name==='supplier'){ state.showAddSupplierModal = false; state.editingSupplierId = null; }
  else if(name==='edit-purchase'){ state.showEditPurchaseModal = null; }
  else if(name==='bills-list') state.showBillsListModal = false;
  else if(name==='edit-bill'){ state.showEditBillModal = null; state.editBillDraft = null; }
  else if(name==='change-password'){ state.showChangePasswordModal = false; state.changePasswordError = ''; }
  else if(name==='receipt'){ state.showReceiptModal = false; state.viewingReceiptFromBillsList = false; }
  render();
}

/* ---------------- action dispatcher ---------------- */
function handleAction(action, el){
  var shop = currentShop();
  switch(action){

    case 'do-login':
      var loginU = document.getElementById('li-username').value.trim();
      var loginP = document.getElementById('li-password').value;
      attemptLogin(loginU, loginP);
      break;

    case 'set-lang':
      state.lang = el.getAttribute('data-lang');
      render();
      break;

    case 'toggle-user-menu':
      state.showUserMenu = !state.showUserMenu;
      render();
      break;

    case 'toggle-mobile-drawer':
      state.showMobileDrawer = !state.showMobileDrawer;
      render();
      break;

    case 'close-mobile-drawer':
      state.showMobileDrawer = false;
      render();
      break;

    case 'open-change-password':
      state.showUserMenu = false;
      state.showChangePasswordModal = true;
      state.changePasswordError = '';
      render();
      break;

    case 'close-change-password':
      closeModalByName('change-password');
      break;

    case 'submit-change-password':
      var cpCurrent = document.getElementById('cp-current').value;
      var cpNew = document.getElementById('cp-new').value;
      var cpConfirm = document.getElementById('cp-confirm').value;
      if(!cpCurrent || !cpNew || !cpConfirm){
        state.changePasswordError = t('err_required');
        render();
        return;
      }
      if(cpCurrent !== shop.adminPassword){
        state.changePasswordError = t('cp_err_wrong_current');
        render();
        return;
      }
      if(cpNew.length < 6){
        state.changePasswordError = t('cp_err_too_short');
        render();
        return;
      }
      if(cpNew !== cpConfirm){
        state.changePasswordError = t('cp_err_mismatch');
        render();
        return;
      }
      shop.adminPassword = cpNew;
      shop.passwordChangedAt = Date.now();
      // Firestore is the single shared source of truth for the "shops"
      // collection — Super Admin's shop list reads from the exact same
      // documents, so saving here is all that's needed for the updated
      // password to show up in Super Admin's shop management view too.
      fbSaveShop(shop);
      sendPasswordChangeEmail(shop);
      state.showChangePasswordModal = false;
      toast(t('cp_success'), 'success');
      render();
      break;

    case 'logout':
      state.currentUser = null;
      state.loginError = '';
      state.showUserMenu = false;
      render();
      break;

    /* ---- super admin ---- */
    case 'super-nav':
      state.superView = el.getAttribute('data-view');
      state.showMobileDrawer = false;
      render();
      break;

    case 'open-create-shop':
      state.createShop = blankCreateShop();
      state.showCreateShopModal = true;
      state.showMobileDrawer = false;
      render();
      break;

    case 'close-create-shop':
      closeModalByName('create-shop');
      break;

    case 'fetch-pan':
      var panInput = document.getElementById('cs-pan');
      var panVal = (panInput.value||'').trim();
      if(!/^\d{9}$/.test(panVal)){
        toast(t('err_pan_digits'), 'error');
        return;
      }
      state.createShop.pan = panVal;
      state.createShop.fetchState = 'loading';
      render();
      setTimeout(function(){
        var rec = PAN_DB[panVal];
        if(rec){
          state.createShop.businessName = rec.businessName;
          state.createShop.ownerName = rec.ownerName;
          state.createShop.address = rec.address;
          state.createShop.regType = rec.regType;
          state.createShop.category = rec.category;
          state.createShop.fetchState = 'found';
        } else {
          state.createShop.fetchState = 'notfound';
        }
        render();
      }, 650);
      break;

    case 'regen-password':
      document.getElementById('cs-password').value = genPassword();
      break;

    case 'submit-create-shop':
      var g = function(id){ var e2=document.getElementById(id); return e2 ? e2.value.trim() : ''; };
      var pan = g('cs-pan'), bname = g('cs-businessName'), oname = g('cs-ownerName'),
          addr = g('cs-address'), reg = g('cs-regType'), cat = g('cs-category'),
          loc = g('cs-location'), email = g('cs-email'), phone = g('cs-phone'),
          uname = g('cs-username'), pwd = g('cs-password'),
          taxTypeEl = document.getElementById('cs-taxtype'), taxType = taxTypeEl ? taxTypeEl.value : 'vat';
      if(!bname || !oname || !addr || !cat || !loc || !email || !phone || !uname || !pwd){
        toast(t('err_required'), 'error');
        return;
      }
      if(!/^\d{9}$/.test(pan)){
        toast(t('err_pan_digits'), 'error');
        return;
      }
      var taken = state.shops.some(function(s){ return s.adminUsername.toLowerCase()===uname.toLowerCase(); });
      if(taken){
        toast(t('err_username_taken'), 'error');
        return;
      }
      // VAT-registered shops always bill at 13%; PAN-only shops never add VAT.
      var newVatRate = (taxType==='vat') ? 13 : 0;
      var newShop = {
        id: uid('s'), businessName:bname, ownerName:oname, pan:pan, regType:reg||'—',
        address:addr, category:cat||'General', location:loc, email:email, phone:phone,
        taxType:taxType, adminUsername:uname, adminPassword:pwd, vatRate:newVatRate,
        merchantId: uname.toUpperCase()+'.MOBILE@BANK', qrProvider:'other', customQr:null, logoImage:null, signatureImage:null, billPrintFormat:'80mm', printTwoCopies:false, active:true,
        invoiceSeq:1, products:[], customers:[], suppliers:[], supplierPurchases:[], sales:[]
      };
      state.shops.push(newShop);
      state.showCreateShopModal = false;
      fbSaveShop(newShop);
      toast(t('toast_shop_created'), 'success');
      render();
      break;

    case 'open-edit-shop':
      state.showEditShopModal = el.getAttribute('data-id');
      state.revealEditShopPassword = false;
      render();
      break;

    case 'close-edit-shop':
      closeModalByName('edit-shop');
      break;

    case 'toggle-reveal-shop-password':
      state.revealEditShopPassword = !state.revealEditShopPassword;
      render();
      break;

    case 'submit-edit-shop':
      var editId = el.getAttribute('data-id');
      var editShop = state.shops.find(function(s){ return s.id===editId; });
      if(!editShop) return;
      var ge = function(id){ var e3=document.getElementById(id); return e3 ? e3.value.trim() : ''; };
      var ePan = ge('es-pan'), eBname = ge('es-businessName'), eOname = ge('es-ownerName'),
          eReg = ge('es-regType'), eCat = ge('es-category'), eAddr = ge('es-address'),
          eLoc = ge('es-location'), eEmail = ge('es-email'), ePhone = ge('es-phone'),
          eTaxTypeEl = document.getElementById('es-taxtype'), eTaxType = eTaxTypeEl ? eTaxTypeEl.value : (editShop.taxType||'vat');
      if(!eBname || !eOname || !eAddr || !eCat || !eLoc || !eEmail || !ePhone){
        toast(t('err_required'), 'error');
        return;
      }
      if(!/^\d{9}$/.test(ePan)){
        toast(t('err_pan_digits'), 'error');
        return;
      }
      editShop.pan = ePan;
      editShop.businessName = eBname;
      editShop.ownerName = eOname;
      editShop.regType = eReg || '—';
      editShop.category = eCat || 'General';
      editShop.address = eAddr;
      editShop.location = eLoc;
      editShop.email = eEmail;
      editShop.phone = ePhone;
      editShop.taxType = eTaxType;
      // VAT-registered shops always bill at 13%; PAN-only shops never add VAT.
      editShop.vatRate = (eTaxType==='vat') ? 13 : 0;
      state.showEditShopModal = null;
      fbSaveShop(editShop);
      toast(t('toast_shop_updated'), 'success');
      render();
      break;

    case 'login-as-shop':
      state.currentUser = {role:'shop', shopId: el.getAttribute('data-id')};
      state.shopView = 'dashboard';
      state.cart = [];
      render();
      break;

    case 'toggle-shop-active':
      var sId = el.getAttribute('data-id');
      var sObj = state.shops.find(function(s){ return s.id===sId; });
      if(sObj){ sObj.active = !(sObj.active!==false); fbSaveShop(sObj); }
      render();
      break;

    case 'open-delete-shop':
      state.showDeleteShopModal = el.getAttribute('data-id');
      state.deleteShopConfirmInput = '';
      render();
      break;

    case 'close-delete-shop':
      closeModalByName('delete-shop');
      break;

    case 'confirm-delete-shop':
      var delId = el.getAttribute('data-id');
      var shopToDelete = state.shops.find(function(s){ return s.id===delId; });
      if(!shopToDelete) return;
      if(state.deleteShopConfirmInput.trim() !== shopToDelete.businessName) return;
      state.shops = state.shops.filter(function(s){ return s.id!==delId; });
      state.showDeleteShopModal = null;
      state.deleteShopConfirmInput = '';
      fbDeleteShop(delId);
      toast(t('toast_shop_deleted'), 'success');
      render();
      break;

    case 'open-reset-shop':
      state.showResetShopModal = el.getAttribute('data-id');
      state.resetShopConfirmInput = '';
      render();
      break;

    case 'close-reset-shop':
      closeModalByName('reset-shop');
      break;

    case 'confirm-reset-shop':
      var resetId = el.getAttribute('data-id');
      var shopToReset = state.shops.find(function(s){ return s.id===resetId; });

      // the shop admin can keep using the same account right away.
      shopToReset.products = [];
      shopToReset.customers = [];
      shopToReset.sales = [];
      shopToReset.suppliers = [];
      shopToReset.supplierPurchases = [];
      shopToReset.invoiceSeq = 1;

    case 'shop-nav':

      state.customerSearch = '';

    /* ---- inventory ---- */
    case 'open-bulk-add-products':
      state.showBulkAddModal = true;
      state.bulkAddSupplierMode = 'none';
      state.bulkAddSelectedSupplierId = '';

    case 'close-bulk-add-products':
      closeModalByName('bulk-add');

    case 'bulk-add-item-row':

      reRenderKeepScroll(['bulk-add-modal-scroll'], 'bulk-add-items-scroll');

    case 'bulk-remove-item-row':
      syncBulkAddRowsFromDOM();
      var bulkRmIdx = parseInt(el.getAttribute('data-idx'));
      state.bulkAddItems.splice(bulkRmIdx, 1);
      if(state.bulkAddItems.length===0) state.bulkAddItems.push(newBulkAddRow());
      reRenderKeepScroll(['bulk-add-modal-scroll', 'bulk-add-items-scroll']);
      break;

    case 'submit-bulk-add-products':
      performBulkAddProducts(shop);
      break;

    case 'open-edit-product':
      state.editingProductId = el.getAttribute('data-id');
      state.showAddProductModal = true;
      var editingProd = shop.products.find(function(p){ return p.id===state.editingProductId; });
      var existingSupplier = editingProd && editingProd.supplierId ? (shop.suppliers||[]).find(function(s){ return s.id===editingProd.supplierId; }) : null;
      if(existingSupplier){
        state.productModalSupplierMode = 'existing';
        state.productModalSelectedSupplierId = existingSupplier.id;
      } else {
        state.productModalSupplierMode = 'none';
        state.productModalSelectedSupplierId = '';
      }
      render();
      break;

    case 'close-product-modal':
      closeModalByName('product');
      break;

    case 'save-product':
      performSaveProduct(shop, el);
      break;

    case 'remove-product':
      var rmId = el.getAttribute('data-id');
      if(window.confirm(t('confirm_remove_product'))){
        shop.products = shop.products.filter(function(p){ return p.id!==rmId; });
        fbSaveShop(shop);
        render();
      }
      break;

    case 'open-add-stock':
      state.showAddStockModal = el.getAttribute('data-id');
      render();
      break;

    case 'close-add-stock':
      closeModalByName('stock');
      break;

    case 'confirm-add-stock':
      var asId = el.getAttribute('data-id');
      var qty = parseInt(document.getElementById('as-qty').value) || 0;
      var prod = shop.products.find(function(p){ return p.id===asId; });
      if(prod && qty>0){
        prod.stock += qty;
        if(prod.supplierId){
          var asPurchaseDateEl = document.getElementById('as-purchase-date');
          var asBillNoEl = document.getElementById('as-bill-no');
          var asPaymentEl = document.getElementById('as-payment-method');
          var asPurchaseDate = asPurchaseDateEl && asPurchaseDateEl.value ? new Date(asPurchaseDateEl.value).getTime() : Date.now();
          if(!shop.supplierPurchases) shop.supplierPurchases = [];
          shop.supplierPurchases.push({
            id: uid('pur'), supplierId:prod.supplierId, productId:prod.id, productName:prod.name,
            qty:qty, costPrice:prod.cost, total:prod.cost*qty, date: asPurchaseDate,
            paymentMethod: asPaymentEl ? asPaymentEl.value : 'cash',
            billNo: asBillNoEl && asBillNoEl.value.trim() ? asBillNoEl.value.trim() : null
          });
        }
        fbSaveShop(shop);
        toast(t('toast_stock_added'), 'success');
      }
      state.showAddStockModal = null;
      render();
      break;

    case 'add-selected-product':
      var selEl = document.getElementById('billing-product-select');
      var selId = selEl ? selEl.value : '';
      if(!selId){ toast(t('bill_select_product_first'), 'error'); return; }
      addProductToCart(shop, selId);
      if(selEl) selEl.value = '';
      render();
      break;

    /* ---- billing / POS ---- */
    case 'cart-add':
      addProductToCart(shop, el.getAttribute('data-id'));
      render();
      break;

    case 'cart-inc':
      var incId = el.getAttribute('data-id');
      var incProd = shop.products.find(function(p){ return p.id===incId; });
      var incItem = state.cart.find(function(c){ return c.productId===incId; });
      if(incItem && incProd && incItem.qty < incProd.stock) incItem.qty++;
      render();
      break;

    case 'cart-dec':
      var decId = el.getAttribute('data-id');
      var decItem = state.cart.find(function(c){ return c.productId===decId; });
      if(decItem){
        decItem.qty--;
        if(decItem.qty<=0) state.cart = state.cart.filter(function(c){ return c.productId!==decId; });
      }
      render();
      break;

    case 'cart-remove':
      var remId = el.getAttribute('data-id');
      state.cart = state.cart.filter(function(c){ return c.productId!==remId; });
      render();
      break;

    case 'set-payment':
      state.billingPayment = el.getAttribute('data-method');
      render();
      break;

    case 'generate-bill':
      actionGenerateBill();
      break;

    case 'close-receipt':
      closeModalByName('receipt');
      break;

    case 'print-invoice':
      window.print();
      break;

    case 'copy-invoice-amount':
      var amt = el.getAttribute('data-amount');
      var copyPromise = (navigator.clipboard && navigator.clipboard.writeText)
        ? navigator.clipboard.writeText(amt)
        : Promise.reject(new Error('no clipboard API'));
      copyPromise.then(function(){
        toast(t('toast_amount_copied') + ': ' + amt, 'success');
      }).catch(function(){
        // Fallback for browsers/contexts without Clipboard API access.
        window.prompt(t('toast_amount_copy_fallback'), amt);
      });
      break;

    /* ---- customers ---- */
    case 'open-add-customer':
      state.showAddCustomerModal = true;
      render();
      break;

    case 'close-add-customer':
      closeModalByName('customer');
      break;

    case 'save-customer':
      var cname = document.getElementById('cm-name').value.trim();
      var cphone = document.getElementById('cm-phone').value.trim();
      var caddr = document.getElementById('cm-address').value.trim();
      if(!cname || !cphone){
        toast(t('err_required'), 'error');
        return;
      }
      var newCust = {id:uid('c'), name:cname, phone:cphone, address:caddr};
      shop.customers.push(newCust);
      state.billingCustomerId = newCust.id;
      state.showAddCustomerModal = false;
      fbSaveShop(shop);
      toast(t('toast_customer_added'), 'success');
      render();
      break;

    /* ---- suppliers ---- */
    case 'supplier-subview':
      state.supplierSubView = el.getAttribute('data-view');
      render();
      break;

    case 'open-add-supplier':
      state.editingSupplierId = null;
      state.showAddSupplierModal = true;
      render();
      break;

    case 'open-edit-supplier':
      state.editingSupplierId = el.getAttribute('data-id');
      state.showAddSupplierModal = true;
      render();
      break;

    case 'close-supplier-modal':
      closeModalByName('supplier');
      break;

    case 'save-supplier':
      var supId = el.getAttribute('data-id');
      var supCompanyName = document.getElementById('sm-company').value.trim();
      var supOwnerName = document.getElementById('sm-owner').value.trim();
      var supEmail = document.getElementById('sm-email').value.trim();
      var supTax = document.getElementById('sm-tax').value.trim();
      var supLocation = document.getElementById('sm-location').value.trim();
      if(!supCompanyName){
        toast(t('err_required'), 'error');
        return;
      }
      if(!shop.suppliers) shop.suppliers = [];
      if(supId){
        var existingSup = shop.suppliers.find(function(s){ return s.id===supId; });
        if(existingSup){
          existingSup.companyName=supCompanyName; existingSup.ownerName=supOwnerName;
          existingSup.email=supEmail; existingSup.taxNumber=supTax; existingSup.location=supLocation;
        }
        toast(t('toast_supplier_updated'), 'success');
      } else {
        shop.suppliers.push({ id: uid('sup'), companyName:supCompanyName, ownerName:supOwnerName, email:supEmail, taxNumber:supTax, location:supLocation });
        toast(t('toast_supplier_added'), 'success');
      }
      state.showAddSupplierModal = false;
      state.editingSupplierId = null;
      fbSaveShop(shop);
      render();
      break;

    case 'open-edit-purchase':
      state.showEditPurchaseModal = el.getAttribute('data-id');
      render();
      break;

    case 'close-edit-purchase':
      closeModalByName('edit-purchase');
      break;

    case 'submit-edit-purchase':
      performEditPurchase(shop);
      break;

    case 'remove-supplier':
      var rmSupId = el.getAttribute('data-id');
      var linkedProducts = shop.products.filter(function(p){ return p.supplierId===rmSupId; }).length;
      var confirmMsg = linkedProducts>0 ? t('confirm_remove_supplier_linked').replace('{n}', linkedProducts) : t('confirm_remove_supplier');
      if(window.confirm(confirmMsg)){
        shop.suppliers = shop.suppliers.filter(function(s){ return s.id!==rmSupId; });
        shop.products.forEach(function(p){ if(p.supplierId===rmSupId) p.supplierId = null; });
        fbSaveShop(shop);
        render();
      }
      break;

    /* ---- reports ---- */
    case 'set-range':
      state.repRange = el.getAttribute('data-range');
      render();
      break;

    /* ---- detailed reports (sales & purchases, printable) ---- */
    case 'set-detailed-report-type':
      state.detailedReportType = el.getAttribute('data-type');
      render();
      break;

    case 'set-detailed-range':
      state.detailedReportRange = el.getAttribute('data-range');
      render();
      break;

    case 'print-detailed-report':
      window.print();
      break;

    case 'toggle-download-menu':
      state.showReportDownloadMenu = !state.showReportDownloadMenu;
      render();
      break;

    case 'download-report-pdf':
      state.showReportDownloadMenu = false;
      render();
      downloadReportAsPdf(shop, state.detailedReportType, state.detailedReportRange);
      break;

    case 'download-report-excel':
      state.showReportDownloadMenu = false;
      render();
      downloadReportAsExcel(shop, state.detailedReportType, state.detailedReportRange);
      break;

    /* ---- bills list (view / edit / cancel) ---- */
    case 'open-bills-list':
      state.showBillsListModal = true;
      render();
      break;

    case 'close-bills-list':
      closeModalByName('bills-list');
      break;

    case 'view-bill':
      var viewId = el.getAttribute('data-id');
      var viewSale = shop.sales.find(function(s){ return s.id===viewId; });
      if(!viewSale) return;
      state.lastInvoice = viewSale;
      state.showReceiptModal = true;
      state.viewingReceiptFromBillsList = true;
      render();
      break;

    case 'open-edit-bill':
      var openEditId = el.getAttribute('data-id');
      var saleToEdit = shop.sales.find(function(s){ return s.id===openEditId; });
      if(!saleToEdit || saleToEdit.cancelled) return;
      state.showEditBillModal = saleToEdit.id;
      state.editBillDraft = {
        saleId: saleToEdit.id,
        invoiceNo: saleToEdit.invoiceNo,
        customerId: saleToEdit.customerId || '',
        payment: saleToEdit.payment,
        items: saleToEdit.items.map(function(it){
          return { productId: it.productId, name: it.name, price: it.price, qty: it.qty, originalQty: it.qty };
        })
      };
      render();
      break;

    case 'close-edit-bill':
      closeModalByName('edit-bill');
      break;

    case 'edit-bill-inc':
      var incIdx = parseInt(el.getAttribute('data-idx'));
      var incDraftItem = state.editBillDraft.items[incIdx];
      var incDraftProd = shop.products.find(function(p){ return p.id===incDraftItem.productId; });
      var incMax = (incDraftProd ? incDraftProd.stock : 0) + (incDraftItem.originalQty||0);
      if(incDraftItem.qty < incMax) incDraftItem.qty++;
      render();
      break;

    case 'edit-bill-dec':
      var decIdx = parseInt(el.getAttribute('data-idx'));
      var decDraftItem = state.editBillDraft.items[decIdx];
      if(decDraftItem.qty > 1) decDraftItem.qty--;
      render();
      break;

    case 'edit-bill-remove-item':
      var rmIdx = parseInt(el.getAttribute('data-idx'));
      state.editBillDraft.items.splice(rmIdx, 1);
      render();
      break;

    case 'edit-bill-add-item':
      var ebSelEl = document.getElementById('eb-product-select');
      var ebProdId = ebSelEl ? ebSelEl.value : '';
      if(!ebProdId){ toast(t('bill_select_product_first'), 'error'); return; }
      var ebProd = shop.products.find(function(p){ return p.id===ebProdId; });
      if(!ebProd) return;
      var existingDraftItem = state.editBillDraft.items.find(function(it){ return it.productId===ebProdId; });
      if(existingDraftItem){
        var maxQty = ebProd.stock + (existingDraftItem.originalQty||0);
        if(existingDraftItem.qty < maxQty) existingDraftItem.qty++;
      } else if(ebProd.stock > 0){
        state.editBillDraft.items.push({ productId: ebProd.id, name: ebProd.name, price: ebProd.price, qty: 1, originalQty: 0 });
      } else {
        toast(t('err_insufficient_stock'), 'error');
        return;
      }
      if(ebSelEl) ebSelEl.value = '';
      render();
      break;

    case 'submit-edit-bill':
      var draft = state.editBillDraft;
      if(!draft || draft.items.length===0) return;
      var editedSale = shop.sales.find(function(s){ return s.id===draft.saleId; });
      if(!editedSale) return;
      // Undo the stock impact of the ORIGINAL items, then apply the new items.
      editedSale.items.forEach(function(oldIt){
        var p = shop.products.find(function(x){ return x.id===oldIt.productId; });
        if(p) p.stock += oldIt.qty;
      });
      var stockOk = draft.items.every(function(it){
        var p = shop.products.find(function(x){ return x.id===it.productId; });
        return p && it.qty <= p.stock;
      });
      if(!stockOk){
        // Revert the undo above since we're aborting the edit.
        editedSale.items.forEach(function(oldIt){
          var p = shop.products.find(function(x){ return x.id===oldIt.productId; });
          if(p) p.stock -= oldIt.qty;
        });
        toast(t('err_insufficient_stock'), 'error');
        return;
      }
      draft.items.forEach(function(it){
        var p = shop.products.find(function(x){ return x.id===it.productId; });
        if(p) p.stock -= it.qty;
      });
      var newSubtotal = draft.items.reduce(function(sum,it){ return sum + it.price*it.qty; }, 0);
      var newVat = newSubtotal * (shop.vatRate/100);
      var editCustomer = shop.customers.find(function(c){ return c.id===draft.customerId; });
      editedSale.items = draft.items.map(function(it){ return {productId:it.productId, name:it.name, qty:it.qty, price:it.price, total:it.price*it.qty}; });
      editedSale.subtotal = newSubtotal;
      editedSale.vat = newVat;
      editedSale.total = newSubtotal + newVat;
      editedSale.payment = draft.payment;
      editedSale.customerId = editCustomer ? editCustomer.id : null;
      editedSale.customerName = editCustomer ? editCustomer.name : null;
      editedSale.edited = true;
      editedSale.editedAt = Date.now();
      state.showEditBillModal = null;
      state.editBillDraft = null;
      fbSaveShop(shop);
      toast(t('toast_bill_updated'), 'success');
      render();
      break;

    case 'cancel-bill':
      var cancelId = el.getAttribute('data-id');
      var saleToCancel = shop.sales.find(function(s){ return s.id===cancelId; });
      if(!saleToCancel || saleToCancel.cancelled) return;
      if(!window.confirm(t('confirm_cancel_bill'))) return;
      saleToCancel.items.forEach(function(it){
        var p = shop.products.find(function(x){ return x.id===it.productId; });
        if(p) p.stock += it.qty;
      });
      saleToCancel.cancelled = true;
      saleToCancel.cancelledAt = Date.now();
      fbSaveShop(shop);
      toast(t('toast_bill_cancelled'), 'success');
      render();
      break;

    case 'delete-bill':
      var deleteBillId = el.getAttribute('data-id');
      var saleToDelete = shop.sales.find(function(s){ return s.id===deleteBillId; });
      if(!saleToDelete) return;
      if(!window.confirm(t('confirm_delete_bill'))) return;
      // If it was never cancelled, its stock was never restored — restore it
      // now so inventory stays accurate after the record disappears.
      if(!saleToDelete.cancelled){
        saleToDelete.items.forEach(function(it){
          var p = shop.products.find(function(x){ return x.id===it.productId; });
          if(p) p.stock += it.qty;
        });
      }
      shop.sales = shop.sales.filter(function(s){ return s.id!==deleteBillId; });
      fbSaveShop(shop);
      toast(t('toast_bill_deleted'), 'success');
      render();
      break;

    /* ---- settings ---- */
    case 'save-shop-settings':
      var stName = document.getElementById('st-name').value.trim();
      var stLoc = document.getElementById('st-location').value.trim();
      var stEmail = document.getElementById('st-email').value.trim();
      var stPhone = document.getElementById('st-phone').value.trim();
      var stTaxTypeEl = document.getElementById('st-taxtype');
      var stTaxType = stTaxTypeEl ? stTaxTypeEl.value : (shop.taxType||'vat');
      var stMerchant = document.getElementById('st-merchant').value.trim();
      var stQrProviderEl = document.getElementById('st-qrprovider');
      var stQrProvider = stQrProviderEl ? stQrProviderEl.value : (shop.qrProvider||'other');
      if(stName) shop.businessName = stName;
      if(stLoc) shop.location = stLoc;
      shop.email = stEmail;
      shop.phone = stPhone;
      shop.taxType = stTaxType;
      // VAT-registered shops always bill at 13%; PAN-only shops never add VAT.
      shop.vatRate = (stTaxType==='vat') ? 13 : 0;
      if(stMerchant) shop.merchantId = stMerchant;
      shop.qrProvider = stQrProvider;
      fbSaveShop(shop);
      toast(t('toast_settings_saved'), 'success');
      render();
      break;

    case 'trigger-qr-upload':
      document.getElementById('qr-upload').click();
      break;

    case 'remove-qr':
      shop.customQr = null;
      fbSaveShop(shop);
      toast(t('toast_qr_updated'), 'success');
      render();
      break;

    case 'trigger-logo-upload':
      document.getElementById('logo-upload').click();
      break;

    case 'remove-logo':
      shop.logoImage = null;
      fbSaveShop(shop);
      toast(t('toast_logo_updated'), 'success');
      render();
      break;

    case 'trigger-signature-upload':
      document.getElementById('signature-upload').click();
      break;

    case 'remove-signature':
      shop.signatureImage = null;
      fbSaveShop(shop);
      toast(t('toast_signature_updated'), 'success');
      render();
      break;

    case 'save-bill-branding':
      var printFormatEl = document.getElementById('st-print-format');
      shop.billPrintFormat = printFormatEl ? printFormatEl.value : (shop.billPrintFormat||'80mm');
      var twoCopiesEl = document.getElementById('st-print-two-copies');
      shop.printTwoCopies = twoCopiesEl ? twoCopiesEl.checked : !!shop.printTwoCopies;
      fbSaveShop(shop);
      toast(t('toast_settings_saved'), 'success');
      render();
      break;

    default:
      break;
  }
}

function addProductToCart(shop, productId){
  var prod = shop.products.find(function(p){ return p.id===productId; });
  if(!prod || prod.stock<=0) return;
  var existingItem = state.cart.find(function(c){ return c.productId===productId; });
  if(existingItem){
    if(existingItem.qty < prod.stock) existingItem.qty++;
  } else {
    state.cart.push({productId:productId, qty:1});
  }
}

function readFileAsDataURL(file){
  return new Promise(function(resolve, reject){
    var reader = new FileReader();
    reader.onload = function(){ resolve(reader.result); };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function performBulkAddProducts(shop){
  syncBulkAddRowsFromDOM();

  // Only rows where the person actually typed a product name count — blank
  // trailing rows left over from "+ Add Item" are silently ignored.
  var candidateRows = state.bulkAddItems.filter(function(r){ return r.name && r.name.trim(); });
  if(candidateRows.length===0){
    toast(t('bulk_add_err_no_items'), 'error');
    return;
  }

  // Validate every row before writing anything — all-or-nothing, so a
  // mistake on row 87 doesn't leave 86 half-imported products behind.
  for(var i=0;i<candidateRows.length;i++){
    var r = candidateRows[i];
    var priceNum = parseFloat(r.price);
    var qtyNum = parseInt(r.qty);
    if(isNaN(priceNum) || isNaN(qtyNum) || qtyNum<0){
      toast(t('bulk_add_err_row_invalid').replace('{n}', String(i+1)).replace('{name}', r.name), 'error');
      return;
    }
  }

  // Resolve the shared supplier for this whole bill (same pattern as the
  // single-product form): an existing one, a brand-new one created here,
  // or none at all.
  var resolvedSupplierId = null;
  if(state.bulkAddSupplierMode==='existing'){
    resolvedSupplierId = state.bulkAddSelectedSupplierId || null;
  } else if(state.bulkAddSupplierMode==='new'){
    var baCompany = document.getElementById('ba-sup-company').value.trim();
    if(baCompany){
      var newBaSupplier = {
        id: uid('sup'), companyName: baCompany,
        ownerName: document.getElementById('ba-sup-owner').value.trim(),
        email: document.getElementById('ba-sup-email').value.trim(),
        taxNumber: document.getElementById('ba-sup-tax').value.trim(),
        location: document.getElementById('ba-sup-location').value.trim()
      };
      if(!shop.suppliers) shop.suppliers = [];
      shop.suppliers.push(newBaSupplier);
      resolvedSupplierId = newBaSupplier.id;
    }
  }

  var purchaseDateEl = document.getElementById('ba-purchase-date');
  var billNoEl = document.getElementById('ba-bill-no');
  var totalAmountEl = document.getElementById('ba-total-amount');
  var paymentEl = document.getElementById('ba-payment-method');
  var billFileEl = document.getElementById('ba-bill-file');

  var purchaseDate = purchaseDateEl && purchaseDateEl.value ? new Date(purchaseDateEl.value).getTime() : Date.now();
  var billNo = billNoEl ? billNoEl.value.trim() : '';
  var billTotalEntered = totalAmountEl ? parseFloat(totalAmountEl.value) : NaN;
  var paymentMethod = paymentEl ? paymentEl.value : 'cash';

  var billAttachment = null, billFileName = null;
  if(billFileEl && billFileEl.files && billFileEl.files[0]){
    var billFile = billFileEl.files[0];
    if(billFile.size > 700*1024){
      toast(t('err_file_too_large'), 'error');
      return;
    }
    try{
      billAttachment = await readFileAsDataURL(billFile);
      billFileName = billFile.name;
    }catch(e){
      console.error('Reading bill attachment failed:', e);
    }
  }

  // Distribute the one shared Total Amount across items proportionally to
  // each item's own cost×qty share — falls back to equal split if every
  // item's cost is 0, and to per-item cost×qty if no Total Amount was given.
  var itemCostTotals = candidateRows.map(function(r){ return (parseFloat(r.cost)||0) * parseInt(r.qty); });
  var sumCostTotals = itemCostTotals.reduce(function(a,b){ return a+b; }, 0);
  var useSharedTotal = !isNaN(billTotalEntered) && billTotalEntered > 0;

  var createdCount = 0;
  candidateRows.forEach(function(r, idx){
    var qtyNum = parseInt(r.qty);
    var costNum = parseFloat(r.cost) || 0;
    var priceNum = parseFloat(r.price);
    var newProductId = uid('p');
    shop.products.push({
      id: newProductId, code: (r.code||'').trim(), name: r.name.trim(), category: r.category.trim()||'General', unit: r.unit.trim()||'pcs',
      price: priceNum, cost: costNum, stock: qtyNum, lowStockThreshold: parseInt(r.lowStockThreshold)||5,
      manufactureDate: r.manufactureDate||null, expiryDate: r.expiryDate||null, supplierId: resolvedSupplierId
    });
    createdCount++;

    if(resolvedSupplierId && qtyNum>0){
      var allocatedTotal = useSharedTotal
        ? (sumCostTotals>0 ? (itemCostTotals[idx]/sumCostTotals)*billTotalEntered : billTotalEntered/candidateRows.length)
        : itemCostTotals[idx];
      if(!shop.supplierPurchases) shop.supplierPurchases = [];
      shop.supplierPurchases.push({
        id: uid('pur'), supplierId: resolvedSupplierId, productId: newProductId, productName: r.name.trim(),
        qty: qtyNum, costPrice: costNum, total: allocatedTotal, date: purchaseDate,
        paymentMethod: paymentMethod, billNo: billNo||null, billAttachment: billAttachment, billFileName: billFileName
      });
    }
  });

  // Exactly one write for the whole batch — every product and purchase-log
  // entry from this bill goes into Firestore together, not one call per row.
  fbSaveShop(shop);

  state.showBulkAddModal = false;
  state.bulkAddSupplierMode = 'none';
  state.bulkAddSelectedSupplierId = '';
  state.bulkAddItems = [];
  toast(t('bulk_add_success').replace('{n}', String(createdCount)), 'success');
  render();
}

async function performEditPurchase(shop){
  var entry = (shop.supplierPurchases||[]).find(function(p){ return p.id===state.showEditPurchaseModal; });
  if(!entry) return;

  var newProductId = document.getElementById('ep-product').value;
  var newQty = parseInt(document.getElementById('ep-qty').value);
  var newCost = parseFloat(document.getElementById('ep-cost').value);
  var newTotalRaw = parseFloat(document.getElementById('ep-total').value);
  var newDateEl = document.getElementById('ep-date');
  var newDate = newDateEl && newDateEl.value ? new Date(newDateEl.value).getTime() : entry.date;
  var newPayment = document.getElementById('ep-payment').value;
  var newBillFileEl = document.getElementById('ep-bill-file');

  var newProduct = shop.products.find(function(p){ return p.id===newProductId; });
  if(!newProduct || isNaN(newQty) || newQty<0 || isNaN(newCost)){
    toast(t('err_required'), 'error');
    return;
  }

  // Reconcile stock: undo this entry's old impact, then apply the new one —
  // handles both "same product, different quantity" and "moved to a
  // different product entirely" without double-counting either way. Checked
  // BEFORE mutating anything, since some of the originally purchased stock
  // may have already been sold — reducing the quantity now could otherwise
  // push a product's stock negative, which isn't physically possible.
  var movingProduct = entry.productId !== newProductId;
  var oldProduct = movingProduct ? shop.products.find(function(p){ return p.id===entry.productId; }) : null;
  var oldProductResultingStock = movingProduct && oldProduct ? oldProduct.stock - entry.qty : null;
  var newProductResultingStock = movingProduct ? newProduct.stock + newQty : newProduct.stock + (newQty - entry.qty);
  if((oldProductResultingStock!==null && oldProductResultingStock<0) || newProductResultingStock<0){
    toast(t('err_purchase_edit_negative_stock'), 'error');
    return;
  }

  // Validate the bill file (if a new one was chosen) BEFORE touching stock —
  // otherwise an oversized-file error would abort the function after stock
  // was already mutated in memory but never saved, leaving things out of sync.
  var pendingBillFile = null;
  if(newBillFileEl && newBillFileEl.files && newBillFileEl.files[0]){
    pendingBillFile = newBillFileEl.files[0];
    if(pendingBillFile.size > 700*1024){
      toast(t('err_file_too_large'), 'error');
      return;
    }
  }

  // Now apply the stock changes already validated above.
  if(movingProduct){
    if(oldProduct) oldProduct.stock = oldProductResultingStock;
    newProduct.stock = newProductResultingStock;
  } else {
    newProduct.stock = newProductResultingStock;
  }

  if(pendingBillFile){
    try{
      entry.billAttachment = await readFileAsDataURL(pendingBillFile);
      entry.billFileName = pendingBillFile.name;
    }catch(e){
      console.error('Reading bill attachment failed:', e);
    }
  }

  entry.productId = newProductId;
  entry.productName = newProduct.name;
  entry.qty = newQty;
  entry.costPrice = newCost;
  entry.total = !isNaN(newTotalRaw) && newTotalRaw>0 ? newTotalRaw : newCost*newQty;
  entry.date = newDate;
  entry.paymentMethod = newPayment;

  fbSaveShop(shop);
  state.showEditPurchaseModal = null;
  toast(t('toast_purchase_updated'), 'success');
  render();
}

async function performSaveProduct(shop, el){
  var pid = el.getAttribute('data-id');
  var code = document.getElementById('pm-code').value.trim();
  var name = document.getElementById('pm-name').value.trim();
  var category = document.getElementById('pm-category').value.trim();
  var unit = document.getElementById('pm-unit').value.trim() || 'pcs';
  var price = parseFloat(document.getElementById('pm-price').value);
  var cost = parseFloat(document.getElementById('pm-cost').value) || 0;
  var lowstock = parseInt(document.getElementById('pm-lowstock').value) || 5;
  var mfgDate = document.getElementById('pm-mfgdate').value || null;
  var expDate = document.getElementById('pm-expdate').value || null;
  if(!name || isNaN(price)){
    toast(t('err_required'), 'error');
    return;
  }

  // Resolve the supplier: an existing one selected from the dropdown,
  // a brand-new one entered inline (created here), or none at all.
  var resolvedSupplierId = null;
  if(state.productModalSupplierMode==='existing'){
    resolvedSupplierId = state.productModalSelectedSupplierId || null;
  } else if(state.productModalSupplierMode==='new'){
    var supCompany = document.getElementById('pm-sup-company').value.trim();
    if(supCompany){
      var newSupplier = {
        id: uid('sup'),
        companyName: supCompany,
        ownerName: document.getElementById('pm-sup-owner').value.trim(),
        email: document.getElementById('pm-sup-email').value.trim(),
        taxNumber: document.getElementById('pm-sup-tax').value.trim(),
        location: document.getElementById('pm-sup-location').value.trim()
      };
      if(!shop.suppliers) shop.suppliers = [];
      shop.suppliers.push(newSupplier);
      resolvedSupplierId = newSupplier.id;
    }
  }

  if(pid){
    var existing = shop.products.find(function(p){ return p.id===pid; });
    if(existing){
      existing.code=code; existing.name=name; existing.category=category; existing.unit=unit;
      existing.price=price; existing.cost=cost; existing.lowStockThreshold=lowstock;
      existing.manufactureDate=mfgDate; existing.expiryDate=expDate;
      existing.supplierId=resolvedSupplierId;

      if(resolvedSupplierId){
        var editPurchaseDateEl = document.getElementById('pm-purchase-date');
        var editTotalAmountEl = document.getElementById('pm-total-amount');
        var editBillFileEl = document.getElementById('pm-bill-file');
        var editPurchasePaymentEl = document.getElementById('pm-purchase-payment');
        var editPurchaseDate = editPurchaseDateEl && editPurchaseDateEl.value ? new Date(editPurchaseDateEl.value).getTime() : Date.now();
        var editTotalAmountEntered = editTotalAmountEl ? parseFloat(editTotalAmountEl.value) : NaN;
        var editPurchasePayment = editPurchasePaymentEl ? editPurchasePaymentEl.value : 'cash';

        var newEditBillAttachment = null, newEditBillFileName = null;
        if(editBillFileEl && editBillFileEl.files && editBillFileEl.files[0]){
          var editBillFile = editBillFileEl.files[0];
          if(editBillFile.size > 700*1024){
            toast(t('err_file_too_large'), 'error');
          } else {
            try{
              newEditBillAttachment = await readFileAsDataURL(editBillFile);
              newEditBillFileName = editBillFile.name;
            }catch(e){
              console.error('Reading bill attachment failed:', e);
            }
          }
        }

        var linkedPurchase = latestPurchaseForProduct(shop, pid);
        if(linkedPurchase){
          // Update the existing purchase record in place rather than creating
          // a duplicate — this is what makes editing feel like "editing".
          linkedPurchase.supplierId = resolvedSupplierId;
          linkedPurchase.date = editPurchaseDate;
          linkedPurchase.costPrice = cost;
          linkedPurchase.paymentMethod = editPurchasePayment;
          if(!isNaN(editTotalAmountEntered) && editTotalAmountEntered > 0){
            linkedPurchase.total = editTotalAmountEntered;
          }
          if(newEditBillAttachment){
            linkedPurchase.billAttachment = newEditBillAttachment;
            linkedPurchase.billFileName = newEditBillFileName;
          }
        } else if(!isNaN(editTotalAmountEntered) && editTotalAmountEntered > 0 || newEditBillAttachment){
          // No purchase was ever logged for this product (e.g. it was created
          // without a supplier, or with zero stock) — create one now using
          // the product's current stock as a best-effort quantity snapshot.
          if(!shop.supplierPurchases) shop.supplierPurchases = [];
          shop.supplierPurchases.push({
            id: uid('pur'), supplierId:resolvedSupplierId, productId:pid, productName:name,
            qty:existing.stock, costPrice:cost,
            total: !isNaN(editTotalAmountEntered) && editTotalAmountEntered > 0 ? editTotalAmountEntered : cost*existing.stock,
            date: editPurchaseDate, paymentMethod:editPurchasePayment, billAttachment:newEditBillAttachment, billFileName:newEditBillFileName
          });
        }
      }
    }
    toast(t('toast_product_updated'), 'success');
  }

  state.showAddProductModal = false;
  state.editingProductId = null;
  state.productModalSupplierMode = 'none';
  state.productModalSelectedSupplierId = '';
  fbSaveShop(shop);
  render();
}

function actionGenerateBill(){
  var shop = currentShop();
  if(state.cart.length===0){ toast(t('err_cart_empty'), 'error'); return; }
  for(var i=0;i<state.cart.length;i++){
    var ci = state.cart[i];
    var cp = shop.products.find(function(p){ return p.id===ci.productId; });
    if(!cp || ci.qty > cp.stock){ toast(t('err_insufficient_stock'), 'error'); return; }
  }
  var subtotal = 0;
  var items = state.cart.map(function(ci){
    var p = shop.products.find(function(x){ return x.id===ci.productId; });
    var lineTotal = p.price * ci.qty;
    subtotal += lineTotal;
    return {productId:p.id, name:p.name, qty:ci.qty, price:p.price, total:lineTotal};
  });
  var discountType = state.billingDiscountType || 'flat';
  var discountValueRaw = Number(state.billingDiscountValue) || 0;
  var discountAmount = discountType==='percent' ? subtotal*(discountValueRaw/100) : discountValueRaw;
  if(discountAmount > subtotal) discountAmount = subtotal;
  if(discountAmount < 0) discountAmount = 0;
  var netSubtotal = subtotal - discountAmount;
  var vat = netSubtotal * (shop.vatRate/100);
  var total = netSubtotal + vat;
  items.forEach(function(it){
    var p = shop.products.find(function(x){ return x.id===it.productId; });
    p.stock -= it.qty;
  });
  var customer = shop.customers.find(function(c){ return c.id===state.billingCustomerId; });
  var invoiceNo = nextInvoiceNo(shop);
  shop.invoiceSeq++;
  var invoice = {
    id: uid('inv'), invoiceNo:invoiceNo, date:Date.now(), items:items,
    subtotal:subtotal, discountType:discountType, discountValue:discountValueRaw, discountAmount:discountAmount,
    vat:vat, total:total, payment:state.billingPayment,
    customerId: customer ? customer.id : null, customerName: customer ? customer.name : null
  };
  shop.sales.push(invoice);
  state.cart = [];
  state.billingCustomerId = '';
  state.billingPayment = 'cash';
  state.billingDiscountType = 'flat';
  state.billingDiscountValue = 0;
  state.productSearch = '';
  state.lastInvoice = invoice;
  state.showReceiptModal = true;
  fbSaveShop(shop);
  render();
  toast(t('toast_sale_recorded'), 'success');
}

function handleQrFile(inputEl){
  var file = inputEl.files && inputEl.files[0];
  if(!file) return;
  // Firestore documents are capped at ~1MB; keep the embedded QR image
  // well under that so the whole shop document still fits.
  if(file.size > 700*1024){
    toast(state.lang==='np' ? 'फाइल धेरै ठूलो छ (700KB भन्दा सानो हुनुपर्छ)।' : 'Image is too large — please use a file under 700KB.', 'error');
    inputEl.value = '';
    return;
  }
  var shop = currentShop();
  var reader = new FileReader();
  reader.onload = function(){
    shop.customQr = reader.result;
    fbSaveShop(shop);
    toast(t('toast_qr_updated'), 'success');
    render();
  };
  reader.readAsDataURL(file);
}

/* ---------------- event binding (delegated, bound once) ---------------- */
function bindEvents(){
  var app = document.getElementById('app');

  app.addEventListener('click', function(e){
    var backdrop = e.target.closest('[data-action="backdrop-close"]');
    if(backdrop && e.target === backdrop){
      closeModalByName(backdrop.getAttribute('data-modal'));
      return;
    }
    if(state.showUserMenu && !e.target.closest('.user-menu-wrap')){
      state.showUserMenu = false;
      render();
      return;
    }
    if(state.showReportDownloadMenu && !e.target.closest('.report-download-wrap')){
      state.showReportDownloadMenu = false;
      render();
      return;
    }
    var el = e.target.closest('[data-action]');
    if(!el) return;
    var action = el.getAttribute('data-action');
    if(action==='backdrop-close') return;
    handleAction(action, el);
  });

  app.addEventListener('keydown', function(e){
    if(e.key==='Enter' && (e.target.id==='li-username' || e.target.id==='li-password')){
      e.preventDefault();
      var u = document.getElementById('li-username').value.trim();
      var p = document.getElementById('li-password').value;
      attemptLogin(u, p);
    }
  });

  app.addEventListener('input', function(e){
    var el = e.target;
    if(el.id==='product-search-input'){
      state.productSearch = el.value;
      reRenderKeepFocus();
    } else if(el.getAttribute && el.getAttribute('data-action')==='search-customers'){
      state.customerSearch = el.value;
      reRenderKeepFocus();
    } else if(el.id==='delete-shop-confirm-input'){
      state.deleteShopConfirmInput = el.value;
      reRenderKeepFocus();
    } else if(el.id==='reset-shop-confirm-input'){
      state.resetShopConfirmInput = el.value;
      reRenderKeepFocus();
    } else if(el.id==='billing-discount-value'){
      state.billingDiscountValue = el.value;
      reRenderKeepFocus();
    } else if(el.classList && el.classList.contains('purchase-date-ad')){
      var bsCompanion = document.getElementById(el.id+'-bs');
      if(bsCompanion) bsCompanion.value = adDateToBsString(el.value);
    } else if(el.classList && el.classList.contains('purchase-date-bs')){
      var adTargetId = el.getAttribute('data-bs-for');
      var convertedAd = bsDateToAdString(el.value);
      if(convertedAd && adTargetId){
        var adField = document.getElementById(adTargetId);
        if(adField) adField.value = convertedAd;
      }
    }
  });

  app.addEventListener('change', function(e){
    var el = e.target;
    if(el.id==='bill-customer'){ state.billingCustomerId = el.value; }
    if(el.id==='billing-discount-type'){ state.billingDiscountType = el.value; render(); }
    if(el.id==='qr-upload'){ handleQrFile(el); }
    if(el.id==='logo-upload'){ handleLogoFile(el); }
    if(el.id==='signature-upload'){ handleSignatureFile(el); }
    if(el.id==='eb-customer' && state.editBillDraft){ state.editBillDraft.customerId = el.value; }
    if(el.id==='eb-payment' && state.editBillDraft){ state.editBillDraft.payment = el.value; }
    if(el.id==='pm-supplier-select'){
      var val = el.value;
      if(val==='none'){ state.productModalSupplierMode = 'none'; state.productModalSelectedSupplierId = ''; }
      else if(val==='new'){ state.productModalSupplierMode = 'new'; state.productModalSelectedSupplierId = ''; }
      else { state.productModalSupplierMode = 'existing'; state.productModalSelectedSupplierId = val; }
      render();
    }
    if(el.id==='ba-supplier-select'){
      syncBulkAddRowsFromDOM();
      var baVal = el.value;
      if(baVal==='none'){ state.bulkAddSupplierMode = 'none'; state.bulkAddSelectedSupplierId = ''; }
      else if(baVal==='new'){ state.bulkAddSupplierMode = 'new'; state.bulkAddSelectedSupplierId = ''; }
      else { state.bulkAddSupplierMode = 'existing'; state.bulkAddSelectedSupplierId = baVal; }
      reRenderKeepScroll(['bulk-add-modal-scroll', 'bulk-add-items-scroll']);
    }
    if(el.classList && el.classList.contains('purchase-date-ad')){
      var bsCompanion2 = document.getElementById(el.id+'-bs');
      if(bsCompanion2) bsCompanion2.value = adDateToBsString(el.value);
    }
  });
}

/* ---------------- boot ---------------- */
function boot(){
  bindEvents();
  initFirebaseThenRender();
}

async function initFirebaseThenRender(){
  // Show the local demo data immediately so the UI never looks blank,
  // then swap in Firestore data (or push the demo data to Firestore)
  // once the module script above has finished initializing.
  render();

  if(!window.__fb){
    await new Promise(function(resolve){
      if(window.__fb) return resolve();
      window.addEventListener('firebase-ready', resolve, {once:true});
      setTimeout(resolve, 4000); // fallback if the CDN/module fails to load
    });
  }

  if(window.__fb){
    try{
      var remoteShops = await window.__fb.loadShops();
      if(remoteShops && remoteShops.length){
        remoteShops.forEach(normalizeShopFields);
        state.shops = remoteShops;
      } else {
        // First run: seed Firestore with the built-in demo shop.
        for(var i=0;i<state.shops.length;i++){
          await window.__fb.saveShop(state.shops[i]);
        }
      }
    }catch(e){
      console.error('Loading shops from Firebase failed, staying on local demo data:', e);
    }
  }
  render();
}

if(document.readyState==='loading'){
  document.addEventListener('DOMContentLoaded', boot);
} else {
  boot();
}
